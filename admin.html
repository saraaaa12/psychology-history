<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>پنل مدیریت | روان‌شناسی‌نامه</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#fff7fb;
  color:#332c38;
  line-height:1.9;
  transition:.3s;
}

body.dark{
  background:#17141c;
  color:#eee;
}

/* ================= HEADER ================= */

header{
  background:linear-gradient(
    135deg,
    #f8c8dc,
    #d9c2f0,
    #c6e8f5
  );
  padding:25px 20px;
  border-bottom-left-radius:30px;
  border-bottom-right-radius:30px;
}

.header-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#5d426f;
  font-size:24px;
  font-weight:bold;
}

.logo span{
  display:block;
  font-size:12px;
  font-weight:normal;
  margin-top:2px;
}

.header-actions{
  display:flex;
  gap:10px;
}

.header-btn{
  border:none;
  padding:10px 15px;
  border-radius:14px;
  background:rgba(255,255,255,.7);
  cursor:pointer;
  font-family:inherit;
  color:#543d61;
}

.header-btn:hover{
  transform:translateY(-2px);
}

/* ================= CONTAINER ================= */

.container{
  max-width:1100px;
  margin:35px auto;
  padding:0 20px;
}

/* ================= WELCOME ================= */

.welcome{
  background:white;
  border-radius:25px;
  padding:30px;
  margin-bottom:25px;
  box-shadow:0 10px 35px rgba(190,120,170,.12);
}

body.dark .welcome{
  background:#24202b;
}

.welcome h1{
  font-size:28px;
  color:#754d83;
  margin-bottom:5px;
}

body.dark .welcome h1{
  color:#e6bde5;
}

.welcome p{
  color:#888;
  font-size:14px;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:30px;
}

.stat{
  padding:25px;
  border-radius:22px;
  color:#45364c;
  position:relative;
  overflow:hidden;
}

.stat:nth-child(1){
  background:#ffdce9;
}

.stat:nth-child(2){
  background:#e5d8fa;
}

.stat:nth-child(3){
  background:#d8f0f7;
}

.stat strong{
  display:block;
  font-size:30px;
}

.stat span{
  font-size:13px;
}

.stat-icon{
  position:absolute;
  left:20px;
  top:20px;
  font-size:30px;
  opacity:.55;
}

/* ================= FORM ================= */

.form-card{
  background:white;
  padding:30px;
  border-radius:25px;
  margin-bottom:30px;
  box-shadow:0 10px 35px rgba(190,120,170,.10);
}

body.dark .form-card{
  background:#24202b;
}

.form-title{
  font-size:21px;
  color:#754d83;
  margin-bottom:25px;
}

body.dark .form-title{
  color:#e6bde5;
}

label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  color:#777;
}

input,
textarea,
select{
  width:100%;
  padding:14px;
  border:1px solid #eadde8;
  border-radius:15px;
  outline:none;
  font-family:inherit;
  background:#fffafd;
  color:#333;
  margin-bottom:18px;
}

body.dark input,
body.dark textarea,
body.dark select{
  background:#19171f;
  color:white;
  border-color:#413747;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#c18bc5;
}

textarea{
  min-height:180px;
  resize:vertical;
}

/* ================= IMAGE ================= */

.image-upload{
  border:2px dashed #dcb8db;
  border-radius:20px;
  padding:25px;
  text-align:center;
  background:#fff8fc;
  margin-bottom:20px;
}

body.dark .image-upload{
  background:#1b1820;
}

.image-upload input{
  border:none;
  background:transparent;
  margin:10px 0;
}

.preview{
  max-width:280px;
  max-height:180px;
  border-radius:18px;
  margin:10px auto;
  display:none;
  object-fit:cover;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
}

.upload-text{
  color:#9a6c9b;
  font-size:14px;
}

/* ================= BUTTONS ================= */

.buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:none;
  padding:12px 22px;
  border-radius:15px;
  cursor:pointer;
  font-family:inherit;
  font-size:14px;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-save{
  background:linear-gradient(135deg,#d88fc0,#9e7ac8);
  color:white;
}

.btn-cancel{
  background:#eee8ef;
  color:#66566b;
}

.btn-delete{
  background:#ffd9df;
  color:#9d4655;
}

.btn-edit{
  background:#e1d5f5;
  color:#644b7b;
}

/* ================= ARTICLES ================= */

.articles-card{
  background:white;
  border-radius:25px;
  padding:30px;
  box-shadow:0 10px 35px rgba(190,120,170,.10);
}

body.dark .articles-card{
  background:#24202b;
}

.article-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.article-head h2{
  color:#754d83;
}

body.dark .article-head h2{
  color:#e6bde5;
}

.article-list{
  display:flex;
  flex-direction:column;
  gap:15px;
}

.article-item{
  border:1px solid #eee2ed;
  border-radius:20px;
  padding:18px;
  display:flex;
  align-items:center;
  gap:15px;
  justify-content:space-between;
}

body.dark .article-item{
  border-color:#403747;
}

.article-info{
  flex:1;
}

.article-info h3{
  font-size:17px;
  margin-bottom:5px;
}

.article-meta{
  color:#999;
  font-size:12px;
}

.article-image{
  width:75px;
  height:65px;
  border-radius:15px;
  object-fit:cover;
  background:#eee;
}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:20px;
  font-size:11px;
  margin-top:8px;
}

.badge-published{
  background:#d9f4e4;
  color:#397052;
}

.badge-draft{
  background:#fff0c9;
  color:#876a22;
}

.article-actions{
  display:flex;
  gap:7px;
}

/* ================= LOGIN ================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 20% 20%,#ffd9e8,transparent 30%),
    radial-gradient(circle at 80% 80%,#ddd0fa,transparent 30%),
    #fff8fc;
}

.login-card{
  width:100%;
  max-width:430px;
  background:white;
  padding:40px;
  border-radius:30px;
  box-shadow:0 20px 60px rgba(160,100,160,.18);
}

.login-card h1{
  color:#754d83;
  margin-bottom:5px;
}

.login-card p{
  color:#999;
  font-size:13px;
  margin-bottom:25px;
}

.login-btn{
  width:100%;
  background:linear-gradient(135deg,#d88fc0,#9e7ac8);
  color:white;
}

.error{
  background:#ffe0e4;
  color:#a33d4b;
  padding:12px;
  border-radius:12px;
  font-size:13px;
  margin-bottom:15px;
  display:none;
}

/* ================= HIDDEN ================= */

#adminPage{
  display:none;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr;
  }

  .header-inner{
    flex-direction:column;
    gap:15px;
  }

  .article-item{
    flex-direction:column;
    align-items:stretch;
  }

  .article-image{
    width:100%;
    height:150px;
  }

  .article-actions{
    justify-content:flex-end;
  }

  .login-card{
    padding:28px;
  }

}

</style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<div id="loginPage">

  <div class="login-card">

    <h1>🌸 خوش اومدی!</h1>

    <p>
      وارد پنل مدیریت روان‌شناسی‌نامه شو
    </p>

    <div id="loginError" class="error"></div>

    <label>ایمیل</label>

    <input
      type="email"
      id="email"
      placeholder="ایمیل"
    >

    <label>رمز عبور</label>

    <input
      type="password"
      id="password"
      placeholder="رمز عبور"
    >

    <button
      class="btn login-btn"
      id="loginBtn"
    >
      ورود به پنل ✨
    </button>

  </div>

</div>


<!-- ================= ADMIN ================= -->

<div id="adminPage">

<header>

  <div class="header-inner">

    <div class="logo">
      🌷 روان‌شناسی‌نامه
      <span>پنل مدیریت محتوا</span>
    </div>

    <div class="header-actions">

      <button
        class="header-btn"
        onclick="toggleDark()"
      >
        🌙
      </button>

      <button
        class="header-btn"
        onclick="logout()"
      >
        خروج
      </button>

    </div>

  </div>

</header>


<div class="container">


  <!-- WELCOME -->

  <div class="welcome">

    <h1>
      سلام مدیر عزیز 🌸
    </h1>

    <p>
      از اینجا می‌تونی مقاله‌های روان‌شناسی‌نامه رو مدیریت کنی.
    </p>

  </div>


  <!-- STATS -->

  <div class="stats">

    <div class="stat">

      <div class="stat-icon">📝</div>

      <strong id="totalCount">0</strong>

      <span>
        همه مقاله‌ها
      </span>

    </div>


    <div class="stat">

      <div class="stat-icon">🌷</div>

      <strong id="publishedCount">0</strong>

      <span>
        منتشر شده
      </span>

    </div>


    <div class="stat">

      <div class="stat-icon">🌙</div>

      <strong id="draftCount">0</strong>

      <span>
        پیش‌نویس
      </span>

    </div>

  </div>


  <!-- FORM -->

  <div class="form-card">

    <div class="form-title">
      ✨ افزودن مقاله جدید
    </div>


    <label>
      عنوان مقاله
    </label>

    <input
      type="text"
      id="title"
      placeholder="مثلاً تاریخچه روان‌شناسی"
    >


    <label>
      دسته‌بندی
    </label>

    <input
      type="text"
      id="category"
      placeholder="مثلاً تاریخ روان‌شناسی"
    >


    <label>
      وضعیت
    </label>

    <select id="status">

      <option value="published">
        منتشر شده
      </option>

      <option value="draft">
        پیش‌نویس
      </option>

    </select>


    <label>
      تصویر مقاله
    </label>

    <div class="image-upload">

      <div class="upload-text">
        🖼️ یک تصویر زیبا برای مقاله انتخاب کن
      </div>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
      >

      <img
        id="preview"
        class="preview"
      >

    </div>


    <label>
      محتوای مقاله
    </label>

    <textarea
      id="content"
      placeholder="متن مقاله را اینجا بنویس..."
    ></textarea>


    <div class="buttons">

      <button
        class="btn btn-save"
        id="saveBtn"
      >
        💾 ذخیره مقاله
      </button>

      <button
        class="btn btn-cancel"
        id="cancelBtn"
        style="display:none;"
      >
        انصراف
      </button>

    </div>

  </div>


  <!-- ARTICLES -->

  <div class="articles-card">

    <div class="article-head">

      <h2>
        📚 مقاله‌ها
      </h2>

    </div>

    <div
      class="article-list"
      id="articleList"
    >
      در حال بارگذاری...
    </div>

  </div>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://wwzgywcezzzrgiqprdeg.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uEoXARjUJ3XhVNWneTMZjQ_uTzwYyt8";

const {createClient}=supabase;

const db=createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let editingId=null;
let currentImageUrl=null;


/* =========================
   LOGIN
========================= */

document
.getElementById("loginBtn")
.addEventListener("click",login);


async function login(){

  const email=
    document.getElementById("email").value.trim();

  const password=
    document.getElementById("password").value;


  const errorBox=
    document.getElementById("loginError");


  errorBox.style.display="none";


  const {data,error}=
    await db.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    errorBox.textContent=
      error.message;

    errorBox.style.display="block";

    return;
  }


  openAdmin();

}


/* =========================
   SESSION
========================= */

async function checkSession(){

  const {
    data:{session}
  }=
    await db.auth.getSession();


  if(session){

    openAdmin();

  }else{

    document
      .getElementById("loginPage")
      .style.display="flex";

  }

}


db.auth.onAuthStateChange(
  (event,session)=>{

    if(session){

      openAdmin();

    }

  }
);


/* =========================
   OPEN ADMIN
========================= */

function openAdmin(){

  document
    .getElementById("loginPage")
    .style.display="none";

  document
    .getElementById("adminPage")
    .style.display="block";

  loadArticles();

}


/* =========================
   LOGOUT
========================= */

async function logout(){

  await db.auth.signOut();

  location.reload();

}


/* =========================
   LOAD ARTICLES
========================= */

async function loadArticles(){

  const list=
    document.getElementById("articleList");


  const {
    data,
    error
  }=
    await db
      .from("article")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    list.innerHTML=
      "خطا در دریافت مقاله‌ها";

    console.error(error);

    return;
  }


  updateStats(data);

  renderArticles(data);

}


/* =========================
   STATS
========================= */

function updateStats(data){

  document.getElementById(
    "totalCount"
  ).textContent=data.length;


  document.getElementById(
    "publishedCount"
  ).textContent=
    data.filter(
      x=>x.status==="published"
    ).length;


  document.getElementById(
    "draftCount"
  ).textContent=
    data.filter(
      x=>x.status==="draft"
    ).length;

}


/* =========================
   RENDER
========================= */

function renderArticles(data){

  const list=
    document.getElementById("articleList");


  if(!data.length){

    list.innerHTML=
      "<p>هنوز مقاله‌ای وجود ندارد 🌷</p>";

    return;
  }


  list.innerHTML="";


  data.forEach(article=>{

    const item=
      document.createElement("div");

    item.className="article-item";


    const image=
      article.image_url
      ?
      `<img class="article-image" src="${article.image_url}">`
      :
      `<div class="article-image"></div>`;


    const badge=
      article.status==="published"
      ?
      `<span class="badge badge-published">منتشر شده</span>`
      :
      `<span class="badge badge-draft">پیش‌نویس</span>`;


    item.innerHTML=`

      ${image}

      <div class="article-info">

        <h3>
          ${escapeHTML(article.title||"بدون عنوان")}
        </h3>

        <div class="article-meta">
          ${escapeHTML(article.category||"بدون دسته‌بندی")}
          ·
          ${article.created_at
            ?new Date(article.created_at)
              .toLocaleDateString("fa-IR")
            :""
          }
        </div>

        ${badge}

      </div>

      <div class="article-actions">

        <button
          class="btn btn-edit"
          onclick="editArticle(${article.id})"
        >
          ✏️ ویرایش
        </button>

        <button
          class="btn btn-delete"
          onclick="deleteArticle(${article.id})"
        >
          🗑️ حذف
        </button>

      </div>
    `;


    list.appendChild(item);

  });

}


/* =========================
   IMAGE PREVIEW
========================= */

document
.getElementById("imageInput")
.addEventListener(
  "change",
  function(){

    const file=this.files[0];

    if(!file)return;


    const reader=
      new FileReader();


    reader.onload=function(e){

      const preview=
        document.getElementById("preview");

      preview.src=e.target.result;

      preview.style.display="block";

    };


    reader.readAsDataURL(file);

  }
);


/* =========================
   UPLOAD IMAGE
========================= */

async function uploadImage(){

  const input=
    document.getElementById("imageInput");

  const file=input.files[0];


  if(!file){

    return currentImageUrl;

  }


  const extension=
    file.name
      .split(".")
      .pop();


  const fileName=
    Date.now()
    +"_"
    +Math.random()
      .toString(36)
      .substring(2)
    +"."+extension;


  const filePath=
    "articles/"
    +fileName;


  const {
    error
  }=
    await db.storage
      .from("article-images")
      .upload(
        filePath,
        file,
        {
          upsert:false
        }
      );


  if(error){

    throw error;

  }


  const {
    data
  }=
    db.storage
      .from("article-images")
      .getPublicUrl(filePath);


  return data.publicUrl;

}


/* =========================
   SAVE ARTICLE
========================= */

document
.getElementById("saveBtn")
.addEventListener(
  "click",
  saveArticle
);


async function saveArticle(){

  const title=
    document
      .getElementById("title")
      .value.trim();


  const category=
    document
      .getElementById("category")
      .value.trim();


  const content=
    document
      .getElementById("content")
      .value.trim();


  const status=
    document
      .getElementById("status")
      .value;


  if(!title || !content){

    alert(
      "عنوان و محتوای مقاله را وارد کن 🌸"
    );

    return;
  }


  const saveBtn=
    document.getElementById("saveBtn");


  saveBtn.disabled=true;

  saveBtn.textContent=
    "در حال ذخیره...";


  try{

    const imageUrl=
      await uploadImage();


    let result;


    if(editingId===null){

      result=
        await db
          .from("article")
          .insert({

            title,
            content,
            category,
            status,
            image_url:imageUrl

          });

    }else{

      result=
        await db
          .from("article")
          .update({

            title,
            content,
            category,
            status,
            image_url:imageUrl

          })
          .eq(
            "id",
            editingId
          );

    }


    if(result.error){

      throw result.error;

    }


    alert(
      "مقاله با موفقیت ذخیره شد 🌷"
    );


    resetForm();

    loadArticles();


  }catch(error){

    console.error(error);

    alert(
      "خطا در ذخیره مقاله:\n"
      +error.message
    );

  }


  saveBtn.disabled=false;

  saveBtn.textContent=
    "💾 ذخیره مقاله";

}


/* =========================
   EDIT
========================= */

async function editArticle(id){

  const {
    data,
    error
  }=
    await db
      .from("article")
      .select("*")
      .eq("id",id)
      .single();


  if(error){

    alert(error.message);

    return;
  }


  editingId=id;

  currentImageUrl=
    data.image_url||null;


  document.getElementById(
    "title"
  ).value=data.title||"";


  document.getElementById(
    "category"
  ).value=data.category||"";


  document.getElementById(
    "content"
  ).value=data.content||"";


  document.getElementById(
    "status"
  ).value=data.status||"published";


  if(data.image_url){

    const preview=
      document.getElementById("preview");

    preview.src=data.image_url;

    preview.style.display="block";

  }


  document.getElementById(
    "cancelBtn"
  ).style.display="inline-block";


  document.getElementById(
    "saveBtn"
  ).textContent=
    "✏️ ذخیره تغییرات";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DELETE
========================= */

async function deleteArticle(id){

  if(
    !confirm(
      "مطمئنی می‌خوای این مقاله رو حذف کنی؟ 🥺"
    )
  ){

    return;
  }


  const {
    error
  }=
    await db
      .from("article")
      .delete()
      .eq("id",id);


  if(error){

    alert(
      "خطا در حذف:\n"
      +error.message
    );

    return;
  }


  loadArticles();

}


/* =========================
   RESET
========================= */

document
.getElementById("cancelBtn")
.addEventListener(
  "click",
  resetForm
);


function resetForm(){

  editingId=null;

  currentImageUrl=null;


  document.getElementById(
    "title"
  ).value="";


  document.getElementById(
    "category"
  ).value="";


  document.getElementById(
    "content"
  ).value="";


  document.getElementById(
    "status"
  ).value="published";


  document.getElementById(
    "imageInput"
  ).value="";


  const preview=
    document.getElementById("preview");

  preview.src="";

  preview.style.display="none";


  document.getElementById(
    "cancelBtn"
  ).style.display="none";


  document.getElementById(
    "saveBtn"
  ).textContent=
    "💾 ذخیره مقاله";

}


/* =========================
   DARK MODE
========================= */

function toggleDark(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "adminDark",
    document.body.classList.contains("dark")
  );

}


if(
  localStorage.getItem("adminDark")==="true"
){

  document.body.classList.add("dark");

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(text){

  const div=
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}

checkSession();
