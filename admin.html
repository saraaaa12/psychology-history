<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت | روان‌شناسی‌نامه</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f7f5f2;
      color: #29252a;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* ================= LOGIN ================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, #eadff0, transparent 35%),
        radial-gradient(circle at bottom left, #dce9e5, transparent 35%),
        #f7f5f2;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.92);
      border-radius: 28px;
      padding: 42px 35px;
      box-shadow: 0 25px 70px rgba(0,0,0,.12);
    }

    .login-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6e5978;
      color: white;
      font-size: 30px;
    }

    .login-box h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .input-group input,
    .input-group textarea,
    .input-group select {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ddd6df;
      border-radius: 13px;
      background: white;
      outline: none;
      font-size: 14px;
    }

    .input-group textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 2;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus {
      border-color: #8d7199;
      box-shadow: 0 0 0 4px rgba(141,113,153,.1);
    }

    .login-btn,
    .primary-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 14px;
      background: #6e5978;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .login-btn:hover,
    .primary-btn:hover {
      transform: translateY(-2px);
      background: #5d4967;
    }

    .login-btn:disabled,
    .primary-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    #loginError {
      display: none;
      background: #fff0f0;
      color: #b33b3b;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    /* ================= ADMIN ================= */

    #adminPage {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      background: #29252a;
      color: white;
      padding: 25px 18px;
      z-index: 100;
    }

    .brand {
      padding: 10px 12px 25px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      margin-bottom: 20px;
    }

    .brand h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .brand span {
      font-size: 12px;
      color: #bcb4bf;
    }

    .menu a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px 14px;
      border-radius: 12px;
      color: #d8d2d9;
      text-decoration: none;
      margin-bottom: 6px;
      font-size: 14px;
      transition: .2s;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,.1);
      color: white;
    }

    .logout-btn {
      position: absolute;
      bottom: 25px;
      right: 18px;
      left: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: #ddd;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    .main {
      margin-right: 260px;
      padding: 35px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 28px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      padding: 9px 14px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #eadff0;
      color: #6e5978;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 25px;
    }

    .stat {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 8px 25px rgba(0,0,0,.05);
    }

    .stat small {
      color: #888;
      display: block;
      margin-bottom: 10px;
    }

    .stat strong {
      font-size: 28px;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,.05);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .article-item {
      padding: 16px 0;
      border-bottom: 1px solid #eee;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .article-item:last-child {
      border-bottom: none;
    }

    .article-item h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    .article-item small {
      color: #999;
    }

    .article-actions {
      display: flex;
      gap: 7px;
    }

    .delete-btn {
      border: none;
      background: #fff0f0;
      color: #b33b3b;
      padding: 7px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-size: 11px;
    }

    .status {
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      white-space: nowrap;
    }

    .published {
      background: #e7f4eb;
      color: #39814d;
    }

    .draft {
      background: #fff3df;
      color: #a66a16;
    }

    .empty {
      text-align: center;
      color: #999;
      padding: 30px 10px;
      line-height: 2;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 15px;
      font-size: 13px;
      line-height: 1.7;
    }

    .success {
      background: #eaf7ed;
      color: #347447;
    }

    .error {
      background: #fff0f0;
      color: #b33b3b;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: #888;
    }

    @media (max-width: 900px) {
      .sidebar {
        width: 220px;
      }

      .main {
        margin-right: 220px;
        padding: 22px;
      }

      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 650px) {
      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .logout-btn {
        position: static;
        width: 100%;
        margin-top: 15px;
      }

      .main {
        margin-right: 0;
      }

      .topbar {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .login-box {
        padding: 32px 22px;
      }

      .article-item {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- ================= LOGIN ================= -->

  <section id="loginPage">

    <div class="login-box">

      <div class="login-logo">🧠</div>

      <h1>ورود مدیر</h1>

      <p class="login-subtitle">
        برای ورود به پنل مدیریت روان‌شناسی‌نامه،
        ایمیل و رمز عبور خود را وارد کنید.
      </p>

      <div id="loginError"></div>

      <form id="loginForm">

        <div class="input-group">
          <label for="email">ایمیل</label>
          <input
            type="email"
            id="email"
            placeholder="ایمیل مدیر"
            required
            autocomplete="email"
          >
        </div>

        <div class="input-group">
          <label for="password">رمز عبور</label>
          <input
            type="password"
            id="password"
            placeholder="رمز عبور"
            required
            autocomplete="current-password"
          >
        </div>

        <button class="login-btn" id="loginBtn" type="submit">
          ورود به پنل
        </button>

      </form>

    </div>

  </section>


  <!-- ================= ADMIN PANEL ================= -->

  <section id="adminPage">

    <aside class="sidebar">

      <div class="brand">
        <h2>روان‌شناسی‌نامه</h2>
        <span>پنل مدیریت</span>
      </div>

      <nav class="menu">

        <a href="#" class="active">
          📊 <span>داشبورد</span>
        </a>

        <a href="#addArticle">
          ✏️ <span>افزودن مقاله</span>
        </a>

        <a href="#articles">
          📚 <span>مقالات</span>
        </a>

      </nav>

      <button class="logout-btn" id="logoutBtn">
        خروج از حساب ←
      </button>

    </aside>


    <main class="main">

      <div class="topbar">

        <div>
          <h1>داشبورد</h1>
          <p style="color:#888;margin-top:7px;">
            مدیریت محتوای روان‌شناسی‌نامه
          </p>
        </div>

        <div class="user-info">

          <div class="avatar">س</div>

          <div>
            <strong id="userEmail">مدیر</strong>
          </div>

        </div>

      </div>


      <!-- STATS -->

      <div class="stats">

        <div class="stat">
          <small>کل مقالات</small>
          <strong id="totalArticles">0</strong>
        </div>

        <div class="stat">
          <small>منتشر شده</small>
          <strong id="publishedArticles">0</strong>
        </div>

        <div class="stat">
          <small>پیش‌نویس</small>
          <strong id="draftArticles">0</strong>
        </div>

      </div>


      <div class="content-grid">


        <!-- ================= ADD ARTICLE ================= -->

        <div class="card" id="addArticle">

          <h2>افزودن مقاله جدید ✍️</h2>

          <div id="articleMessage" class="message"></div>

          <form id="articleForm">

            <div class="input-group">

              <label for="articleTitle">
                عنوان مقاله
              </label>

              <input
                type="text"
                id="articleTitle"
                placeholder="مثلاً روان‌شناسی در دوران باستان"
                required
              >

            </div>


            <div class="input-group">

              <label for="articleCategory">
                دسته‌بندی
              </label>

              <input
                type="text"
                id="articleCategory"
                placeholder="مثلاً تاریخ روان‌شناسی"
              >

            </div>


            <div class="input-group">

              <label for="articleStatus">
                وضعیت
              </label>

              <select id="articleStatus">

                <option value="published">
                  منتشر شده
                </option>

                <option value="draft">
                  پیش‌نویس
                </option>

              </select>

            </div>


            <div class="input-group">

              <label for="articleContent">
                متن مقاله
              </label>

              <textarea
                id="articleContent"
                placeholder="متن مقاله را اینجا بنویس..."
                required
              ></textarea>

            </div>


            <button
              class="primary-btn"
              id="saveArticleBtn"
              type="submit"
            >
              💾 ذخیره مقاله
            </button>

          </form>

        </div>


        <!-- ================= ARTICLES ================= -->

        <div class="card" id="articles">

          <h2>مقالات من</h2>

          <div id="articlesList">

            <div class="loading">
              در حال دریافت مقالات...
            </div>

          </div>

        </div>

      </div>

    </main>

  </section>


  <script>

    /* =====================================
       SUPABASE
    ===================================== */

    const SUPABASE_URL =
      "https://wwzgywcezzzrgiqprdeg.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uEoXARjUJ3XhVNWneTMZjQ_uTzwYyt8";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================
       ELEMENTS
    ===================================== */

    const loginPage =
      document.getElementById("loginPage");

    const adminPage =
      document.getElementById("adminPage");

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginError =
      document.getElementById("loginError");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const userEmail =
      document.getElementById("userEmail");

    const articleForm =
      document.getElementById("articleForm");

    const saveArticleBtn =
      document.getElementById("saveArticleBtn");

    const articlesList =
      document.getElementById("articlesList");

    const articleMessage =
      document.getElementById("articleMessage");


    /* =====================================
       LOGIN PAGE
    ===================================== */

    function showLogin() {

      adminPage.style.display = "none";

      loginPage.style.display = "flex";

    }


    /* =====================================
       ADMIN PAGE
    ===================================== */

    function showAdmin(user) {

      loginPage.style.display = "none";

      adminPage.style.display = "block";

      if (user && user.email) {
        userEmail.textContent = user.email;
      }

      loadArticles();

    }


    /* =====================================
       CHECK SESSION
    ===================================== */

    async function checkSession() {

      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (session && session.user) {

        showAdmin(session.user);

      } else {

        showLogin();

      }

    }


    /* =====================================
       LOGIN
    ===================================== */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        loginError.style.display = "none";

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        loginBtn.disabled = true;

        loginBtn.textContent = "در حال ورود...";


        const {
          data,
          error
        } =
        await supabaseClient.auth.signInWithPassword({

          email: email,

          password: password

        });


        if (error) {

          loginError.textContent =
            "ایمیل یا رمز عبور صحیح نیست.";

          loginError.style.display = "block";

          loginBtn.disabled = false;

          loginBtn.textContent = "ورود به پنل";

          return;

        }


        if (data.user) {

          showAdmin(data.user);

        }


        loginBtn.disabled = false;

        loginBtn.textContent = "ورود به پنل";

      }
    );


    /* =====================================
       LOGOUT
    ===================================== */

    logoutBtn.addEventListener(
      "click",
      async function() {

        await supabaseClient.auth.signOut();

        showLogin();

      }
    );


    /* =====================================
       MESSAGE
    ===================================== */

    function showArticleMessage(
      text,
      type
    ) {

      articleMessage.textContent = text;

      articleMessage.className =
        "message " + type;

      articleMessage.style.display =
        "block";

      setTimeout(
        function() {

          articleMessage.style.display =
            "none";

        },
        3500
      );

    }


    /* =====================================
       ADD ARTICLE
    ===================================== */

    articleForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const title =
          document
            .getElementById("articleTitle")
            .value
            .trim();

        const category =
          document
            .getElementById("articleCategory")
            .value
            .trim();

        const content =
          document
            .getElementById("articleContent")
            .value
            .trim();

        const status =
          document
            .getElementById("articleStatus")
            .value;


        if (!title || !content) {

          showArticleMessage(
            "عنوان و متن مقاله را وارد کن.",
            "error"
          );

          return;

        }


        saveArticleBtn.disabled = true;

        saveArticleBtn.textContent =
          "در حال ذخیره...";


        const {
          data: {
            user
          }
        } =
        await supabaseClient.auth.getUser();


        if (!user) {

          showArticleMessage(
            "جلسه ورود شما منقضی شده است. دوباره وارد شوید.",
            "error"
          );

          showLogin();

          return;

        }


        const {
          error
        } =
        await supabaseClient
          .from("article")
          .insert([{

            title: title,

            content: content,

            category: category,

            status: status

          }]);


        if (error) {

          console.error(error);

          showArticleMessage(
            "ذخیره مقاله انجام نشد. تنظیمات جدول و Policy را بررسی کن.",
            "error"
          );

        } else {

          showArticleMessage(
            "مقاله با موفقیت ذخیره شد! 🎉",
            "success"
          );

          articleForm.reset();

          loadArticles();

        }


        saveArticleBtn.disabled = false;

        saveArticleBtn.textContent =
          "💾 ذخیره مقاله";

      }
    );


    /* =====================================
       LOAD ARTICLES
    ===================================== */

    async function loadArticles() {

      articlesList.innerHTML =
        '<div class="loading">در حال دریافت مقالات...</div>';


      const {
        data,
        error
      } =
      await supabaseClient
        .from("article")
        .select("*")
        .order(
          "created_at",
          { ascending: false }
        );


      if (error) {

        console.error(error);

        articlesList.innerHTML =
          '<div class="empty">دریافت مقالات انجام نشد.</div>';

        return;

      }


      updateStats(data || []);

      renderArticles(data || []);

    }


    /* =====================================
       STATS
    ===================================== */

    function updateStats(
      articles
    ) {

      const total =
        articles.length;

      const published =
        articles.filter(
          article =>
            article.status === "published"
        ).length;

      const drafts =
        articles.filter(
          article =>
            article.status === "draft"
        ).length;


      document.getElementById(
        "totalArticles"
      ).textContent = total;


      document.getElementById(
        "publishedArticles"
      ).textContent = published;


      document.getElementById(
        "draftArticles"
      ).textContent = drafts;

    }


    /* =====================================
       RENDER ARTICLES
    ===================================== */

    function renderArticles(
      articles
    ) {

      if (!articles.length) {

        articlesList.innerHTML =
          `
          <div class="empty">
            هنوز مقاله‌ای اضافه نکرده‌ای.
            <br>
            اولین مقاله‌ات را از فرم کناری اضافه کن ✨
          </div>
          `;

        return;

      }


      articlesList.innerHTML =
        articles
          .map(
            article => {

              const statusClass =
                article.status === "published"
                  ? "published"
                  : "draft";

              const statusText =
                article.status === "published"
                  ? "منتشر شده"
                  : "پیش‌نویس";


              return `
                <div class="article-item">

                  <div>

                    <h3>
                      ${escapeHtml(article.title)}
                    </h3>

                    <small>
                      ${escapeHtml(article.category || "بدون دسته‌بندی")}
                    </small>

                  </div>

                  <div class="article-actions">

                    <span class="status ${statusClass}">
                      ${statusText}
                    </span>

                    <button
                      class="delete-btn"
                      onclick="deleteArticle('${article.id}')"
                    >
                      حذف
                    </button>

                  </div>

                </div>
              `;

            }
          )
          .join("");

    }


    /* =====================================
       DELETE ARTICLE
    ===================================== */

    async function deleteArticle(
      id
    ) {

      const confirmDelete =
        confirm(
          "آیا مطمئنی می‌خواهی این مقاله حذف شود؟"
        );


      if (!confirmDelete) {
        return;
      }


      const {
        error
      } =
      await supabaseClient
        .from("article")
        .delete()
        .eq(
          "id",
          id
        );


      if (error) {

        alert(
          "حذف مقاله انجام نشد."
        );

        console.error(error);

        return;

      }


      loadArticles();

    }


    /* =====================================
       ESCAPE HTML
    ===================================== */

    function escapeHtml(
      value
    ) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    /* =====================================
       AUTH STATE
    ===================================== */

    supabaseClient.auth.onAuthStateChange(
      function(
        event,
        session
      ) {

        if (
          session &&
          session.user
        ) {

          showAdmin(
            session.user
          );

        } else {

          showLogin();

        }

      }
    );


    /* =====================================
       START
    ===================================== */

    checkSession();

  </script>

</body>
</html>
