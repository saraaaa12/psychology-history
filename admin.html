<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت | روان‌شناسی‌نامه</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f7f5f2;
      color: #29252a;
    }

    button,
    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* ================= LOGIN ================= */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top right, #eadff0, transparent 35%),
        radial-gradient(circle at bottom left, #dce9e5, transparent 35%),
        #f7f5f2;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: rgba(255,255,255,.95);
      border-radius: 28px;
      padding: 42px 35px;
      box-shadow: 0 25px 70px rgba(0,0,0,.12);
    }

    .login-logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 20px;
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #6e5978;
      color: white;
      font-size: 30px;
    }

    .login-box h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 30px;
      line-height: 1.8;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 14px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .input-group input,
    .input-group textarea,
    .input-group select {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #ddd6df;
      border-radius: 13px;
      background: white;
      outline: none;
      font-size: 14px;
    }

    .input-group textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 2;
    }

    .input-group input:focus,
    .input-group textarea:focus,
    .input-group select:focus {
      border-color: #8d7199;
      box-shadow: 0 0 0 4px rgba(141,113,153,.1);
    }

    .login-btn,
    .primary-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 14px;
      background: #6e5978;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-btn:disabled,
    .primary-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    #loginError {
      display: none;
      background: #fff0f0;
      color: #b33b3b;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    /* ================= ADMIN ================= */

    #adminPage {
      display: none;
      min-height: 100vh;
    }

    .sidebar {
      position: fixed;
      right: 0;
      top: 0;
      width: 260px;
      height: 100vh;
      background: #29252a;
      color: white;
      padding: 25px 18px;
      z-index: 100;
    }

    .brand {
      padding: 10px 12px 25px;
      border-bottom: 1px solid rgba(255,255,255,.1);
      margin-bottom: 20px;
    }

    .brand h2 {
      font-size: 20px;
      margin-bottom: 5px;
    }

    .brand span {
      font-size: 12px;
      color: #bcb4bf;
    }

    .menu a {
      display: block;
      padding: 13px 14px;
      border-radius: 12px;
      color: #d8d2d9;
      text-decoration: none;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .menu a:hover,
    .menu a.active {
      background: rgba(255,255,255,.1);
      color: white;
    }

    .logout-btn {
      position: absolute;
      bottom: 25px;
      right: 18px;
      left: 18px;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: #ddd;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
    }

    .main {
      margin-right: 260px;
      padding: 35px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .topbar h1 {
      font-size: 28px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      background: white;
      padding: 9px 14px;
      border-radius: 14px;
      box-shadow: 0 5px 20px rgba(0,0,0,.05);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: #eadff0;
      color: #6e5978;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 25px rgba(0,0,0,.05);
      margin-bottom: 20px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .message {
      display: none;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.9;
      word-break: break-word;
    }

    .success {
      display: block;
      background: #eaf7ed;
      color: #347447;
    }

    .error {
      display: block;
      background: #fff0f0;
      color: #b33b3b;
    }

    .debug-box {
      margin-top: 15px;
      background: #29252a;
      color: #f4f4f4;
      padding: 14px;
      border-radius: 12px;
      font-family: monospace;
      direction: ltr;
      text-align: left;
      font-size: 12px;
      line-height: 1.7;
      overflow-x: auto;
      display: none;
    }

    @media (max-width: 650px) {

      .sidebar {
        position: static;
        width: 100%;
        height: auto;
      }

      .logout-btn {
        position: static;
        width: 100%;
        margin-top: 15px;
      }

      .main {
        margin-right: 0;
        padding: 20px;
      }

      .topbar {
        align-items: flex-start;
        gap: 15px;
        flex-direction: column;
      }

      .login-box {
        padding: 32px 22px;
      }
    }
  </style>
</head>

<body>


<!-- ================= LOGIN ================= -->

<section id="loginPage">

  <div class="login-box">

    <div class="login-logo">
      🧠
    </div>

    <h1>
      ورود مدیر
    </h1>

    <p class="login-subtitle">
      برای ورود به پنل مدیریت روان‌شناسی‌نامه،
      ایمیل و رمز عبور خود را وارد کنید.
    </p>

    <div id="loginError"></div>

    <form id="loginForm">

      <div class="input-group">

        <label>
          ایمیل
        </label>

        <input
          type="email"
          id="email"
          placeholder="ایمیل مدیر"
          required
        >

      </div>

      <div class="input-group">

        <label>
          رمز عبور
        </label>

        <input
          type="password"
          id="password"
          placeholder="رمز عبور"
          required
        >

      </div>

      <button
        class="login-btn"
        id="loginBtn"
        type="submit"
      >
        ورود به پنل
      </button>

    </form>

  </div>

</section>


<!-- ================= ADMIN ================= -->

<section id="adminPage">

  <aside class="sidebar">

    <div class="brand">

      <h2>
        روان‌شناسی‌نامه
      </h2>

      <span>
        پنل مدیریت
      </span>

    </div>

    <nav class="menu">

      <a
        href="#addArticle"
        class="active"
      >
        ✏️ افزودن مقاله
      </a>

    </nav>

    <button
      class="logout-btn"
      id="logoutBtn"
    >
      خروج از حساب
    </button>

  </aside>


  <main class="main">

    <div class="topbar">

      <div>

        <h1>
          افزودن مقاله
        </h1>

        <p style="color:#888;margin-top:7px;">
          مقاله جدیدت را از اینجا به سایت اضافه کن.
        </p>

      </div>

      <div class="user-info">

        <div class="avatar">
          س
        </div>

        <strong id="userEmail">
          مدیر
        </strong>

      </div>

    </div>


    <div class="card">

      <h2>
        مقاله جدید ✍️
      </h2>


      <div
        id="articleMessage"
        class="message"
      ></div>


      <div
        id="debugBox"
        class="debug-box"
      ></div>


      <form id="articleForm">

        <div class="input-group">

          <label>
            عنوان مقاله
          </label>

          <input
            type="text"
            id="articleTitle"
            placeholder="مثلاً روان‌شناسی در دوران باستان"
            required
          >

        </div>


        <div class="input-group">

          <label>
            دسته‌بندی
          </label>

          <input
            type="text"
            id="articleCategory"
            placeholder="مثلاً تاریخ روان‌شناسی"
          >

        </div>


        <div class="input-group">

          <label>
            وضعیت مقاله
          </label>

          <select id="articleStatus">

            <option value="published">
              منتشر شده
            </option>

            <option value="draft">
              پیش‌نویس
            </option>

          </select>

        </div>


        <div class="input-group">

          <label>
            متن مقاله
          </label>

          <textarea
            id="articleContent"
            placeholder="متن مقاله را اینجا بنویس..."
            required
          ></textarea>

        </div>


        <button
          class="primary-btn"
          id="saveArticleBtn"
          type="submit"
        >
          💾 ذخیره مقاله
        </button>

      </form>

    </div>

  </main>

</section>


<script>


/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
  "https://wwzgywcezzzrgiqprdeg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uEoXARjUJ3XhVNWneTMZjQ_uTzwYyt8";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   ELEMENTS
========================================= */

const loginPage =
  document.getElementById("loginPage");

const adminPage =
  document.getElementById("adminPage");

const loginForm =
  document.getElementById("loginForm");

const loginBtn =
  document.getElementById("loginBtn");

const loginError =
  document.getElementById("loginError");

const logoutBtn =
  document.getElementById("logoutBtn");

const userEmail =
  document.getElementById("userEmail");

const articleForm =
  document.getElementById("articleForm");

const saveArticleBtn =
  document.getElementById("saveArticleBtn");

const articleMessage =
  document.getElementById("articleMessage");

const debugBox =
  document.getElementById("debugBox");


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin() {

  adminPage.style.display = "none";

  loginPage.style.display = "flex";

}


/* =========================================
   SHOW ADMIN
========================================= */

function showAdmin(user) {

  loginPage.style.display = "none";

  adminPage.style.display = "block";

  if (user && user.email) {

    userEmail.textContent =
      user.email;

  }

}


/* =========================================
   CHECK SESSION
========================================= */

async function checkSession() {

  try {

    const {
      data: {
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if (
      session &&
      session.user
    ) {

      showAdmin(
        session.user
      );

    } else {

      showLogin();

    }

  } catch (error) {

    console.error(error);

    showLogin();

  }

}


/* =========================================
   LOGIN
========================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    loginError.style.display =
      "none";


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    loginBtn.disabled =
      true;

    loginBtn.textContent =
      "در حال ورود...";


    try {

      const {
        data,
        error
      } =
      await supabaseClient.auth
        .signInWithPassword({

          email: email,

          password: password

        });


      if (error) {

        throw error;

      }


      showAdmin(
        data.user
      );


    } catch (error) {

      loginError.textContent =
        "خطا: " +
        error.message;

      loginError.style.display =
        "block";

    }


    loginBtn.disabled =
      false;

    loginBtn.textContent =
      "ورود به پنل";

  }
);


/* =========================================
   LOGOUT
========================================= */

logoutBtn.addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    showLogin();

  }
);


/* =========================================
   SHOW MESSAGE
========================================= */

function showMessage(
  text,
  type,
  details = ""
) {

  articleMessage.textContent =
    text;

  articleMessage.className =
    "message " + type;

  articleMessage.style.display =
    "block";


  if (details) {

    debugBox.textContent =
      details;

    debugBox.style.display =
      "block";

  } else {

    debugBox.style.display =
      "none";

  }

}


/* =========================================
   SAVE ARTICLE
========================================= */

articleForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    debugBox.style.display =
      "none";

    articleMessage.style.display =
      "none";


    const title =
      document
        .getElementById("articleTitle")
        .value
        .trim();


    const category =
      document
        .getElementById("articleCategory")
        .value
        .trim();


    const content =
      document
        .getElementById("articleContent")
        .value
        .trim();


    const status =
      document
        .getElementById("articleStatus")
        .value;


    if (
      !title ||
      !content
    ) {

      showMessage(
        "عنوان و متن مقاله را وارد کن.",
        "error"
      );

      return;

    }


    saveArticleBtn.disabled =
      true;

    saveArticleBtn.textContent =
      "در حال ذخیره...";


    try {

      /* -----------------------------
         بررسی ورود کاربر
      ----------------------------- */

      const {
        data: {
          user
        }
      } =
      await supabaseClient.auth.getUser();


      if (!user) {

        throw new Error(
          "کاربر وارد حساب نشده است."
        );

      }


      /* -----------------------------
         ارسال مقاله به جدول article
      ----------------------------- */

      const {
        data,
        error
      } =
      await supabaseClient
        .from("article")
        .insert({

          title: title,

          content: content,

          category: category,

          status: status

        })
        .select();


      /* -----------------------------
         بررسی خطا
      ----------------------------- */

      if (error) {

        throw error;

      }


      /* -----------------------------
         موفقیت
      ----------------------------- */

      showMessage(
        "✅ مقاله با موفقیت ثبت شد!",
        "success"
      );


      articleForm.reset();


      console.log(
        "Article inserted:",
        data
      );


    } catch (error) {

      console.error(
        "SUPABASE ERROR:",
        error
      );


      let details =
        "";


      if (error.message) {

        details +=
          "message: " +
          error.message +
          "\n\n";

      }


      if (error.code) {

        details +=
          "code: " +
          error.code +
          "\n\n";

      }


      if (error.details) {

        details +=
          "details: " +
          error.details +
          "\n\n";

      }


      if (error.hint) {

        details +=
          "hint: " +
          error.hint;

      }


      showMessage(
        "❌ مقاله ثبت نشد. متن خطای زیر را برای من بفرست:",
        "error",
        details || "خطای نامشخص"
      );

    }


    saveArticleBtn.disabled =
      false;

    saveArticleBtn.textContent =
      "💾 ذخیره مقاله";

  }
);


/* =========================================
   AUTH STATE
========================================= */

supabaseClient.auth.onAuthStateChange(
  function(
    event,
    session
  ) {

    if (
      session &&
      session.user
    ) {

      showAdmin(
        session.user
      );

    } else {

      showLogin();

    }

  }
);


/* =========================================
   START
========================================= */

checkSession();


</script>

</body>
</html>
