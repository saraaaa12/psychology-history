<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | روان‌شناسی‌نامه</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Tahoma,Arial,sans-serif;
    background:#f5f6fa;
    color:#252733;
}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}

.login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:linear-gradient(135deg,#f5f0ff,#eef7ff);
}
.login-box{
    width:100%;
    max-width:420px;
    background:white;
    padding:35px;
    border-radius:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.12);
}
.logo{
    text-align:center;
    font-size:26px;
    font-weight:bold;
    margin-bottom:8px;
}
.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:28px;
}
.field{
    margin-bottom:16px;
}
.field label{
    display:block;
    margin-bottom:7px;
    font-size:14px;
    font-weight:bold;
}
.field input,
.field textarea,
.field select{
    width:100%;
    padding:13px 14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:14px;
    background:white;
}
.field input:focus,
.field textarea:focus,
.field select:focus{
    border-color:#7c5cff;
}
.field textarea{
    min-height:180px;
    resize:vertical;
}
.btn{
    border:0;
    border-radius:12px;
    padding:13px 18px;
    font-weight:bold;
}
.btn-primary{
    width:100%;
    background:#7c5cff;
    color:white;
}
.btn-primary:hover{opacity:.9}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
}
.message.success{
    display:block;
    background:#e9f9ef;
    color:#18733b;
}
.message.error{
    display:block;
    background:#fff0f0;
    color:#b42318;
}

.admin{
    display:none;
    min-height:100vh;
}
.sidebar{
    position:fixed;
    right:0;
    top:0;
    bottom:0;
    width:250px;
    background:#171827;
    color:white;
    padding:25px 15px;
    z-index:20;
}
.sidebar-logo{
    font-size:21px;
    font-weight:bold;
    padding:0 15px 25px;
}
.sidebar-logo small{
    display:block;
    font-size:12px;
    color:#aaa;
    margin-top:5px;
}
.nav-item{
    padding:13px 15px;
    border-radius:11px;
    margin:5px 0;
    color:#c9c9d3;
    cursor:pointer;
}
.nav-item:hover,
.nav-item.active{
    background:#2b2b43;
    color:white;
}
.main{
    margin-right:250px;
    padding:30px;
}
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    margin-bottom:30px;
}
.topbar h1{
    margin:0;
    font-size:26px;
}
.user-area{
    display:flex;
    align-items:center;
    gap:10px;
}
.logout{
    background:#fff;
    border:1px solid #ddd;
    border-radius:10px;
    padding:9px 13px;
}
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px;
    margin-bottom:25px;
}
.stat{
    background:white;
    border-radius:18px;
    padding:22px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}
.stat span{
    color:#777;
    font-size:13px;
}
.stat strong{
    display:block;
    font-size:28px;
    margin-top:8px;
}
.card{
    background:white;
    border-radius:18px;
    padding:24px;
    margin-bottom:25px;
    box-shadow:0 5px 20px rgba(0,0,0,.05);
}
.card-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}
.card-header h2{
    margin:0;
    font-size:19px;
}
.add-btn{
    background:#7c5cff;
    color:white;
    border:0;
    border-radius:11px;
    padding:11px 16px;
    font-weight:bold;
}
.article-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:16px 0;
    border-bottom:1px solid #eee;
}
.article-row:last-child{border-bottom:0}
.article-info{
    min-width:0;
}
.article-title{
    font-weight:bold;
    margin-bottom:6px;
}
.article-meta{
    font-size:12px;
    color:#888;
}
.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    margin-right:5px;
}
.badge-published{
    background:#e8f7ee;
    color:#19713a;
}
.badge-draft{
    background:#fff5db;
    color:#8b6500;
}
.actions{
    display:flex;
    gap:7px;
    flex-shrink:0;
}
.action{
    border:0;
    padding:8px 11px;
    border-radius:9px;
    font-size:12px;
}
.edit{
    background:#eeeaff;
    color:#6248d8;
}
.delete{
    background:#fff0f0;
    color:#c62828;
}
.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}
.full{grid-column:1/-1}
.form-actions{
    display:flex;
    justify-content:flex-start;
    gap:10px;
    margin-top:18px;
}
.save{
    background:#7c5cff;
    color:white;
}
.cancel{
    background:#eee;
}
.loading{
    text-align:center;
    color:#888;
    padding:25px;
}

@media(max-width:900px){
    .sidebar{
        width:210px;
    }
    .main{
        margin-right:210px;
    }
    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}
@media(max-width:700px){
    .sidebar{
        position:static;
        width:100%;
        min-height:auto;
    }
    .main{
        margin-right:0;
        padding:18px;
    }
    .stats{
        grid-template-columns:1fr 1fr;
    }
    .form-grid{
        grid-template-columns:1fr;
    }
    .full{
        grid-column:auto;
    }
    .topbar{
        align-items:flex-start;
        flex-direction:column;
    }
    .article-row{
        align-items:flex-start;
        flex-direction:column;
    }
}

/* dark mode */
body.dark{
    background:#101116;
    color:#eee;
}
body.dark .card,
body.dark .stat,
body.dark .logout,
body.dark .login-box{
    background:#1b1d25;
    color:#eee;
}
body.dark .field input,
body.dark .field textarea,
body.dark .field select{
    background:#111319;
    color:#eee;
    border-color:#343744;
}
body.dark .article-row{
    border-color:#30323c;
}
body.dark .cancel{
    background:#30323c;
    color:white;
}
body.dark .login-screen{
    background:#101116;
}
</style>
</head>

<body>

<!-- LOGIN -->
<section class="login-screen" id="loginScreen">
    <div class="login-box">
        <div class="logo">روان‌شناسی‌نامه</div>
        <div class="subtitle">ورود به پنل مدیریت</div>

        <div class="field">
            <label>ایمیل</label>
            <input id="email" type="email" placeholder="ایمیل مدیر">
        </div>

        <div class="field">
            <label>رمز عبور</label>
            <input id="password" type="password" placeholder="رمز عبور">
        </div>

        <button class="btn btn-primary" id="loginBtn">
            ورود به پنل
        </button>

        <div class="message" id="loginMessage"></div>
    </div>
</section>

<!-- ADMIN -->
<div class="admin" id="adminPanel">

    <aside class="sidebar">
        <div class="sidebar-logo">
            روان‌شناسی‌نامه
            <small>پنل مدیریت</small>
        </div>

        <div class="nav-item active">داشبورد</div>
        <div class="nav-item" onclick="showArticleForm()">افزودن مقاله</div>
        <div class="nav-item" onclick="document.getElementById('articlesCard').scrollIntoView({behavior:'smooth'})">
            مقالات
        </div>
        <div class="nav-item" onclick="toggleDark()">حالت شب</div>
        <div class="nav-item" onclick="window.open('index.html','_blank')">
            مشاهده سایت
        </div>
        <div class="nav-item" onclick="logout()">
            خروج
        </div>
    </aside>

    <main class="main">

        <div class="topbar">
            <div>
                <h1>داشبورد</h1>
                <div style="color:#888;margin-top:6px;font-size:13px">
                    مدیریت محتوای روان‌شناسی‌نامه
                </div>
            </div>

            <div class="user-area">
                <span id="userEmail"></span>
                <button class="logout" onclick="logout()">خروج</button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats">
            <div class="stat">
                <span>کل مقالات</span>
                <strong id="totalArticles">0</strong>
            </div>

            <div class="stat">
                <span>منتشر شده</span>
                <strong id="publishedArticles">0</strong>
            </div>

            <div class="stat">
                <span>پیش‌نویس</span>
                <strong id="draftArticles">0</strong>
            </div>

            <div class="stat">
                <span>وضعیت اتصال</span>
                <strong id="connectionStatus">...</strong>
            </div>
        </div>

        <!-- ADD / EDIT FORM -->
        <div class="card" id="articleFormCard" style="display:none">

            <div class="card-header">
                <h2 id="formTitle">افزودن مقاله جدید</h2>
            </div>

            <div class="form-grid">

                <div class="field">
                    <label>عنوان مقاله</label>
                    <input id="articleTitle" type="text" placeholder="عنوان مقاله">
                </div>

                <div class="field">
                    <label>دسته‌بندی</label>
                    <input id="articleCategory" type="text" placeholder="مثلاً تاریخ روان‌شناسی">
                </div>

                <div class="field">
                    <label>وضعیت</label>
                    <select id="articleStatus">
                        <option value="published">منتشر شده</option>
                        <option value="draft">پیش‌نویس</option>
                    </select>
                </div>

                <div class="field full">
                    <label>متن مقاله</label>
                    <textarea id="articleContent" placeholder="متن مقاله را اینجا بنویس..."></textarea>
                </div>

            </div>

            <div class="form-actions">
                <button class="btn save" id="saveBtn" onclick="saveArticle()">
                    ذخیره مقاله
                </button>

                <button class="btn cancel" onclick="hideArticleForm()">
                    لغو
                </button>
            </div>

            <div class="message" id="formMessage"></div>
        </div>

        <!-- ARTICLES -->
        <div class="card" id="articlesCard">

            <div class="card-header">
                <h2>مقالات</h2>

                <button class="add-btn" onclick="showArticleForm()">
                    + مقاله جدید
                </button>
            </div>

            <div id="articlesList">
                <div class="loading">در حال دریافت مقالات...</div>
            </div>

        </div>

    </main>
</div>

<script>
const SUPABASE_URL = "https://wwzgywcezzzrgiqprdeg.supabase.co";
const SUPABASE_KEY = "sb_publishable_uEoXARjUJ3XhVNWneTMZjQ_uTzwYyt8";

const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;


/* ---------------- LOGIN ---------------- */

document.getElementById("loginBtn").addEventListener("click", login);

async function login(){

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if(!email || !password){
        showMessage("loginMessage","ایمیل و رمز عبور را وارد کن.","error");
        return;
    }

    const btn = document.getElementById("loginBtn");
    btn.disabled = true;
    btn.textContent = "در حال ورود...";

    const { data, error } = await db.auth.signInWithPassword({
        email,
        password
    });

    btn.disabled = false;
    btn.textContent = "ورود به پنل";

    if(error){
        showMessage("loginMessage","ورود ناموفق: " + error.message,"error");
        return;
    }

    openAdmin(data.user);
}


/* ---------------- SESSION ---------------- */

async function checkSession(){

    const { data, error } = await db.auth.getSession();

    if(error){
        console.error(error);
        return;
    }

    if(data.session){
        openAdmin(data.session.user);
    }
}

db.auth.onAuthStateChange((event, session)=>{

    if(session){
        openAdmin(session.user);
    }else{
        showLogin();
    }

});

checkSession();


function openAdmin(user){

    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("adminPanel").style.display = "block";

    document.getElementById("userEmail").textContent =
        user.email || "";

    loadArticles();
}


function showLogin(){

    document.getElementById("loginScreen").style.display = "flex";
    document.getElementById("adminPanel").style.display = "none";
}


/* ---------------- ARTICLES ---------------- */

async function loadArticles(){

    const list = document.getElementById("articlesList");

    list.innerHTML =
        '<div class="loading">در حال دریافت مقالات...</div>';

    const { data, error } = await db
        .from("article")
        .select("*")
        .order("created_at",{ascending:false});

    if(error){

        console.error(error);

        list.innerHTML =
            '<div class="message error" style="display:block">' +
            "خطا در دریافت مقالات: " +
            escapeHtml(error.message) +
            "</div>";

        document.getElementById("connectionStatus").textContent = "خطا";
        return;
    }

    document.getElementById("connectionStatus").textContent = "متصل";

    const articles = data || [];

    document.getElementById("totalArticles").textContent =
        articles.length;

    document.getElementById("publishedArticles").textContent =
        articles.filter(a => a.status === "published").length;

    document.getElementById("draftArticles").textContent =
        articles.filter(a => a.status === "draft").length;

    if(articles.length === 0){

        list.innerHTML =
            '<div class="loading">هنوز مقاله‌ای ثبت نشده است.</div>';

        return;
    }

    list.innerHTML = articles.map(article => {

        const date = article.created_at
            ? new Date(article.created_at).toLocaleString("fa-IR")
            : "بدون تاریخ";

        const badge =
            article.status === "published"
            ? '<span class="badge badge-published">منتشر شده</span>'
            : '<span class="badge badge-draft">پیش‌نویس</span>';

        return `
            <div class="article-row">

                <div class="article-info">

                    <div class="article-title">
                        ${escapeHtml(article.title || "بدون عنوان")}
                    </div>

                    <div class="article-meta">
                        ${escapeHtml(article.category || "بدون دسته‌بندی")}
                        · ${date}
                        ${badge}
                    </div>

                </div>

                <div class="actions">

                    <button class="action edit"
                        onclick="editArticle(${article.id})">
                        ویرایش
                    </button>

                    <button class="action delete"
                        onclick="deleteArticle(${article.id})">
                        حذف
                    </button>

                </div>

            </div>
        `;

    }).join("");
}


/* ---------------- ADD / EDIT ---------------- */

function showArticleForm(){

    document.getElementById("articleFormCard").style.display = "block";

    document.getElementById("articleFormCard")
        .scrollIntoView({behavior:"smooth"});

    if(editingId === null){

        document.getElementById("formTitle").textContent =
            "افزودن مقاله جدید";

        document.getElementById("articleTitle").value = "";
        document.getElementById("articleCategory").value = "";
        document.getElementById("articleStatus").value = "published";
        document.getElementById("articleContent").value = "";

    }
}


function hideArticleForm(){

    document.getElementById("articleFormCard").style.display = "none";

    editingId = null;

    document.getElementById("formMessage").className = "message";
    document.getElementById("formMessage").textContent = "";
}


/* ---------------- SAVE ---------------- */

async function saveArticle(){

    const title =
        document.getElementById("articleTitle").value.trim();

    const category =
        document.getElementById("articleCategory").value.trim();

    const status =
        document.getElementById("articleStatus").value;

    const content =
        document.getElementById("articleContent").value.trim();

    if(!title || !content){

        showMessage(
            "formMessage",
            "عنوان و متن مقاله الزامی است.",
            "error"
        );

        return;
    }

    const btn = document.getElementById("saveBtn");

    btn.disabled = true;
    btn.textContent = "در حال ذخیره...";

    let result;

    try{

        if(editingId === null){

            result = await db
                .from("article")
                .insert({
                    title,
                    content,
                    category,
                    status
                })
                .select();

        }else{

            result = await db
                .from("article")
                .update({
                    title,
                    content,
                    category,
                    status
                })
                .eq("id", editingId)
                .select();

        }

        if(result.error){
            throw result.error;
        }

        showMessage(
            "formMessage",
            editingId === null
                ? "مقاله با موفقیت ذخیره شد ✅"
                : "مقاله با موفقیت ویرایش شد ✅",
            "success"
        );

        editingId = null;

        btn.disabled = false;
        btn.textContent = "ذخیره مقاله";

        await loadArticles();

        setTimeout(()=>{
            hideArticleForm();
        },1000);

    }catch(error){

        console.error(error);

        btn.disabled = false;
        btn.textContent = "ذخیره مقاله";

        showMessage(
            "formMessage",
            "خطا در ذخیره مقاله: " + (error.message || "خطای نامشخص"),
            "error"
        );
    }
}


/* ---------------- EDIT ---------------- */

async function editArticle(id){

    const { data, error } = await db
        .from("article")
        .select("*")
        .eq("id",id)
        .single();

    if(error){

        showMessage(
            "formMessage",
            "خطا در دریافت مقاله: " + error.message,
            "error"
        );

        return;
    }

    editingId = id;

    document.getElementById("formTitle").textContent =
        "ویرایش مقاله";

    document.getElementById("articleTitle").value =
        data.title || "";

    document.getElementById("articleCategory").value =
        data.category || "";

    document.getElementById("articleStatus").value =
        data.status || "draft";

    document.getElementById("articleContent").value =
        data.content || "";

    showArticleForm();
}


/* ---------------- DELETE ---------------- */

async function deleteArticle(id){

    const confirmed = confirm(
        "آیا مطمئنی می‌خواهی این مقاله را حذف کنی؟"
    );

    if(!confirmed) return;

    const { error } = await db
        .from("article")
        .delete()
        .eq("id",id);

    if(error){

        alert("خطا در حذف مقاله: " + error.message);
        return;
    }

    await loadArticles();
}


/* ---------------- LOGOUT ---------------- */

async function logout(){

    await db.auth.signOut();
    showLogin();
}


/* ---------------- DARK MODE ---------------- */

function toggleDark(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "adminDark",
        document.body.classList.contains("dark")
    );
}

if(localStorage.getItem("adminDark") === "true"){
    document.body.classList.add("dark");
}


/* ---------------- HELPERS ---------------- */

function showMessage(id,text,type){

    const el = document.getElementById(id);

    el.textContent = text;
    el.className = "message " + type;
}


function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}
</script>

</body>
</html>
