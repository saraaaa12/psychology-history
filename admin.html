<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت | روان‌شناسی‌نامه</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Vazirmatn,sans-serif;
  background:#f6f0ec;
  color:#332d35;
  min-height:100vh;
}

button,input,textarea,select{
  font-family:inherit;
}

button{
  cursor:pointer;
  border:0;
}

.hidden{
  display:none!important;
}

/* ================= LOGIN ================= */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at 10% 20%,rgba(239,180,208,.45),transparent 30%),
    radial-gradient(circle at 90% 80%,rgba(196,180,235,.45),transparent 30%),
    #f8f1ed;
}

.login-card{
  width:min(440px,100%);
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.9);
  border-radius:30px;
  padding:40px 32px;
  box-shadow:0 20px 60px rgba(92,66,82,.12);
}

.logo{
  width:75px;
  height:75px;
  border-radius:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 20px;
  font-size:36px;
  background:linear-gradient(135deg,#e8b3ce,#cbb8e8);
}

.login-card h1{
  text-align:center;
  font-size:26px;
  margin-bottom:8px;
}

.login-card>p{
  text-align:center;
  color:#817780;
  margin-bottom:28px;
  font-size:14px;
}

.field{
  margin-bottom:17px;
}

.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid #e5dce1;
  background:#fff;
  border-radius:14px;
  padding:13px 15px;
  outline:none;
  transition:.2s;
  color:#332d35;
}

.field textarea{
  min-height:230px;
  resize:vertical;
  line-height:2;
}

.field input:focus,
.field textarea:focus,
.field select:focus{
  border-color:#c89abd;
  box-shadow:0 0 0 4px rgba(200,154,189,.12);
}

.primary-btn{
  width:100%;
  padding:14px;
  border-radius:15px;
  background:linear-gradient(135deg,#d99fbe,#aa91d0);
  color:white;
  font-weight:800;
  font-size:15px;
  box-shadow:0 8px 20px rgba(170,145,208,.22);
}

.message{
  margin-top:15px;
  padding:11px 14px;
  border-radius:12px;
  font-size:13px;
  display:none;
}

.message.error{
  display:block;
  background:#fff0f1;
  color:#a84955;
}

.message.success{
  display:block;
  background:#eef9f1;
  color:#36734a;
}

/* ================= APP ================= */

#app{
  min-height:100vh;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.84);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #e9dfe5;
}

.topbar-inner{
  max-width:1200px;
  margin:auto;
  padding:14px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  font-weight:800;
}

.brand-icon{
  width:44px;
  height:44px;
  border-radius:14px;
  background:linear-gradient(135deg,#e8b3ce,#cbb8e8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
}

.top-actions{
  display:flex;
  gap:8px;
}

.small-btn{
  padding:9px 13px;
  border-radius:12px;
  background:#f4edf2;
  color:#554b54;
  font-size:12px;
  font-weight:700;
}

.small-btn:hover{
  background:#eadde7;
}

.logout{
  background:#fff0f1;
  color:#a84955;
}

/* ================= MAIN ================= */

.container{
  width:min(1200px,calc(100% - 30px));
  margin:30px auto 60px;
}

.welcome{
  margin-bottom:25px;
}

.welcome h1{
  font-size:30px;
  margin-bottom:6px;
}

.welcome p{
  color:#837880;
  font-size:14px;
}

/* ================= STATS ================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  border:1px solid #eadfe5;
  border-radius:22px;
  padding:22px;
  box-shadow:0 8px 25px rgba(80,55,70,.05);
}

.stat-icon{
  font-size:25px;
  margin-bottom:10px;
}

.stat-number{
  font-size:28px;
  font-weight:800;
}

.stat-label{
  color:#8b8088;
  font-size:13px;
  margin-top:3px;
}

/* ================= DASHBOARD ================= */

.dashboard{
  display:grid;
  grid-template-columns:380px 1fr;
  gap:20px;
  align-items:start;
}

.panel{
  background:white;
  border:1px solid #eadfe5;
  border-radius:24px;
  padding:23px;
  box-shadow:0 8px 25px rgba(80,55,70,.05);
}

.panel-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.panel-title h2{
  font-size:18px;
}

.panel-title span{
  font-size:12px;
  color:#8b8088;
}

/* ================= IMAGE ================= */

.upload-box{
  border:2px dashed #dccbd6;
  border-radius:18px;
  padding:18px;
  text-align:center;
  background:#fcf8fa;
  margin-bottom:17px;
}

.upload-box input{
  display:none;
}

.upload-label{
  display:inline-block;
  background:#f1e6ed;
  color:#665762;
  padding:10px 15px;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
}

.preview{
  margin-top:15px;
  position:relative;
}

.preview img{
  width:100%;
  max-height:220px;
  object-fit:cover;
  border-radius:16px;
  display:block;
}

.remove-image{
  margin-top:9px;
  background:#fff0f1;
  color:#a84955;
  padding:8px 12px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
}

/* ================= FORM ================= */

.form-actions{
  display:flex;
  gap:9px;
  margin-top:15px;
}

.save-btn{
  flex:1;
  background:linear-gradient(135deg,#d99fbe,#aa91d0);
  color:white;
  padding:13px;
  border-radius:13px;
  font-weight:800;
}

.cancel-btn{
  padding:13px 17px;
  border-radius:13px;
  background:#f2ecef;
  color:#655a63;
  font-weight:700;
}

/* ================= ARTICLES ================= */

.article-list{
  display:flex;
  flex-direction:column;
  gap:12px;
}

.article-item{
  border:1px solid #eee5e9;
  border-radius:18px;
  padding:13px;
  display:flex;
  align-items:center;
  gap:13px;
  transition:.2s;
}

.article-item:hover{
  transform:translateY(-1px);
  box-shadow:0 8px 20px rgba(80,55,70,.06);
}

.article-thumb{
  width:76px;
  height:76px;
  flex:none;
  border-radius:14px;
  overflow:hidden;
  background:#f4edf1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:26px;
}

.article-thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.article-info{
  flex:1;
  min-width:0;
}

.article-info h3{
  font-size:14px;
  margin-bottom:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.article-meta{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  font-size:11px;
  color:#8b8088;
}

.status{
  padding:4px 8px;
  border-radius:8px;
  font-weight:700;
}

.status.published{
  background:#eaf7ed;
  color:#397449;
}

.status.draft{
  background:#f5edf8;
  color:#79518c;
}

.article-actions{
  display:flex;
  gap:5px;
}

.icon-btn{
  width:34px;
  height:34px;
  border-radius:10px;
  background:#f4eef2;
  font-size:15px;
}

.icon-btn:hover{
  background:#eadde7;
}

.icon-btn.delete{
  background:#fff0f1;
  color:#a84955;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#92868e;
  font-size:13px;
}

.loading{
  text-align:center;
  padding:30px;
  color:#887b84;
}

/* ================= DARK ================= */

body.dark{
  background:#201c21;
  color:#f3edf1;
}

body.dark .topbar{
  background:rgba(32,28,33,.88);
  border-color:#383039;
}

body.dark .panel,
body.dark .stat{
  background:#29242a;
  border-color:#3b333c;
}

body.dark .field input,
body.dark .field textarea,
body.dark .field select{
  background:#211d22;
  border-color:#403740;
  color:#f5eff2;
}

body.dark .upload-box,
body.dark .article-thumb{
  background:#211d22;
}

body.dark .article-item{
  border-color:#3b333c;
}

body.dark .small-btn,
body.dark .cancel-btn,
body.dark .icon-btn{
  background:#38313a;
  color:#eee5ea;
}

body.dark .welcome p,
body.dark .stat-label,
body.dark .article-meta,
body.dark .panel-title span{
  color:#aaa0a8;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){
  .dashboard{
    grid-template-columns:1fr;
  }
}

@media(max-width:650px){
  .stats{
    grid-template-columns:1fr;
  }

  .container{
    width:min(100% - 20px,1200px);
    margin-top:20px;
  }

  .welcome h1{
    font-size:24px;
  }

  .topbar-inner{
    padding:11px 10px;
  }

  .brand span{
    display:none;
  }

  .article-item{
    align-items:flex-start;
  }

  .article-actions{
    flex-direction:column;
  }

  .panel{
    padding:17px;
  }
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<section id="loginPage">

  <div class="login-card">

    <div class="logo">🧠</div>

    <h1>پنل مدیریت</h1>

    <p>مدیریت محتوای روان‌شناسی‌نامه</p>

    <form id="loginForm">

      <div class="field">
        <label>ایمیل</label>
        <input
          type="email"
          id="email"
          placeholder="ایمیل حساب"
          required
        >
      </div>

      <div class="field">
        <label>رمز عبور</label>
        <input
          type="password"
          id="password"
          placeholder="رمز عبور"
          required
        >
      </div>

      <button class="primary-btn" type="submit">
        ورود به پنل
      </button>

      <div id="loginMessage" class="message"></div>

    </form>

  </div>

</section>


<!-- ================= APP ================= -->

<section id="app" class="hidden">

  <header class="topbar">

    <div class="topbar-inner">

      <div class="brand">
        <div class="brand-icon">🧠</div>
        <span>روان‌شناسی‌نامه | مدیریت</span>
      </div>

      <div class="top-actions">

        <button
          class="small-btn"
          onclick="window.open('index.html','_blank')"
        >
          مشاهده سایت
        </button>

        <button
          class="small-btn"
          id="themeBtn"
        >
          ◐
        </button>

        <button
          class="small-btn logout"
          id="logoutBtn"
        >
          خروج
        </button>

      </div>

    </div>

  </header>


  <main class="container">

    <div class="welcome">
      <h1>سلام 👋</h1>
      <p>اینجا می‌تونی مقالات سایت رو مدیریت کنی.</p>
    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <div class="stat-icon">📚</div>
        <div class="stat-number" id="totalCount">0</div>
        <div class="stat-label">کل مقالات</div>
      </div>

      <div class="stat">
        <div class="stat-icon">🌸</div>
        <div class="stat-number" id="publishedCount">0</div>
        <div class="stat-label">منتشر شده</div>
      </div>

      <div class="stat">
        <div class="stat-icon">📝</div>
        <div class="stat-number" id="draftCount">0</div>
        <div class="stat-label">پیش‌نویس</div>
      </div>

    </div>


    <div class="dashboard">

      <!-- ================= FORM ================= -->

      <div class="panel">

        <div class="panel-title">
          <h2 id="formTitle">افزودن مقاله</h2>
          <span id="editStatus"></span>
        </div>


        <form id="articleForm">

          <div class="field">
            <label>عنوان مقاله</label>
            <input
              id="articleTitle"
              type="text"
              placeholder="مثلاً روان‌کاوی چیست؟"
              required
            >
          </div>


          <div class="field">
            <label>دسته‌بندی</label>

            <input
              id="articleCategory"
              type="text"
              placeholder="مثلاً مکاتب روان‌شناسی"
            >
          </div>


          <div class="field">
            <label>وضعیت</label>

            <select id="articleStatus">

              <option value="published">
                منتشر شود
              </option>

              <option value="draft">
                پیش‌نویس
              </option>

            </select>

          </div>


          <div class="field">
            <label>متن مقاله</label>

            <textarea
              id="articleContent"
              placeholder="متن مقاله را اینجا بنویس..."
              required
            ></textarea>

          </div>


          <!-- IMAGE -->

          <div class="field">

            <label>تصویر مقاله</label>

            <div class="upload-box">

              <input
                type="file"
                id="imageInput"
                accept="image/*"
              >

              <label
                class="upload-label"
                for="imageInput"
              >
                📷 انتخاب تصویر
              </label>

              <div
                id="preview"
                class="preview hidden"
              ></div>

            </div>

          </div>


          <div class="form-actions">

            <button
              type="submit"
              class="save-btn"
              id="saveBtn"
            >
              ذخیره مقاله
            </button>

            <button
              type="button"
              class="cancel-btn hidden"
              id="cancelBtn"
            >
              انصراف
            </button>

          </div>

          <div id="formMessage" class="message"></div>

        </form>

      </div>


      <!-- ================= ARTICLES ================= -->

      <div class="panel">

        <div class="panel-title">
          <h2>مقالات</h2>

          <span id="articleCountText">
            در حال بارگذاری...
          </span>
        </div>

        <div id="articleList" class="article-list">
          <div class="loading">
            در حال دریافت مقالات...
          </div>
        </div>

      </div>

    </div>

  </main>

</section>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://wwzgywcezzzrgiqprdeg.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uEoXARjUJ3XhVNWneTMZjQ_uTzwYyt8";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   ELEMENTS
===================================================== */

const loginPage =
  document.getElementById("loginPage");

const app =
  document.getElementById("app");

const loginForm =
  document.getElementById("loginForm");

const loginMessage =
  document.getElementById("loginMessage");

const articleForm =
  document.getElementById("articleForm");

const articleList =
  document.getElementById("articleList");

const imageInput =
  document.getElementById("imageInput");

const preview =
  document.getElementById("preview");

const cancelBtn =
  document.getElementById("cancelBtn");

const formTitle =
  document.getElementById("formTitle");

const saveBtn =
  document.getElementById("saveBtn");

const formMessage =
  document.getElementById("formMessage");

let editingId = null;
let oldImageUrl = null;


/* =====================================================
   HELPERS
===================================================== */

function showMessage(element,text,type){

  element.textContent = text;
  element.className =
    "message " + type;

}


function clearMessage(element){

  element.textContent = "";
  element.className = "message";

}


/* =====================================================
   LOGIN
===================================================== */

loginForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  clearMessage(loginMessage);

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    showMessage(
      loginMessage,
      "ایمیل یا رمز عبور صحیح نیست.",
      "error"
    );

    return;
  }

  await startApp();

});


/* =====================================================
   START APP
===================================================== */

async function startApp(){

  loginPage.classList.add("hidden");
  app.classList.remove("hidden");

  await loadArticles();

}


/* =====================================================
   CHECK SESSION
===================================================== */

async function checkSession(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();

  if(session){

    await startApp();

  }else{

    loginPage.classList.remove("hidden");
    app.classList.add("hidden");

  }

}

checkSession();


/* =====================================================
   LOGOUT
===================================================== */

document
  .getElementById("logoutBtn")
  .addEventListener("click",async()=>{

    await supabaseClient.auth.signOut();

    location.reload();

  });


/* =====================================================
   LOAD ARTICLES
===================================================== */

async function loadArticles(){

  articleList.innerHTML =
    `<div class="loading">
      در حال دریافت مقالات...
    </div>`;

  const {
    data,
    error
  } =
    await supabaseClient
      .from("article")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    articleList.innerHTML =
      `<div class="empty">
        خطا در دریافت مقالات
      </div>`;

    console.error(error);

    return;
  }

  updateStats(data || []);

  renderArticles(data || []);

}


/* =====================================================
   STATS
===================================================== */

function updateStats(articles){

  const total =
    articles.length;

  const published =
    articles.filter(
      a=>a.status==="published"
    ).length;

  const drafts =
    articles.filter(
      a=>a.status!=="published"
    ).length;

  document.getElementById("totalCount")
    .textContent=total;

  document.getElementById("publishedCount")
    .textContent=published;

  document.getElementById("draftCount")
    .textContent=drafts;

  document.getElementById("articleCountText")
    .textContent =
      `${total} مقاله`;

}


/* =====================================================
   RENDER ARTICLES
===================================================== */

function renderArticles(articles){

  if(!articles.length){

    articleList.innerHTML =
      `<div class="empty">
        هنوز مقاله‌ای اضافه نشده است.
      </div>`;

    return;
  }

  articleList.innerHTML =
    articles.map(article=>{

      const status =
        article.status==="published"
          ? "published"
          : "draft";

      const statusText =
        status==="published"
          ? "منتشر شده"
          : "پیش‌نویس";

      const image =
        article.image_url
          ? `<img
               src="${escapeHtml(article.image_url)}"
               alt=""
               onerror="this.parentElement.innerHTML='🧠'"
             >`
          : "🧠";

      return `

        <div class="article-item">

          <div class="article-thumb">
            ${image}
          </div>

          <div class="article-info">

            <h3>
              ${escapeHtml(article.title || "بدون عنوان")}
            </h3>

            <div class="article-meta">

              ${
                article.category
                  ? `<span>${escapeHtml(article.category)}</span>`
                  : ""
              }

              <span class="status ${status}">
                ${statusText}
              </span>

            </div>

          </div>

          <div class="article-actions">

            <button
              class="icon-btn"
              title="ویرایش"
              onclick="editArticle(${article.id})"
            >
              ✏️
            </button>

            <button
              class="icon-btn delete"
              title="حذف"
              onclick="deleteArticle(${article.id})"
            >
              🗑️
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================================
   IMAGE PREVIEW
===================================================== */

imageInput.addEventListener("change",()=>{

  const file =
    imageInput.files[0];

  if(!file){

    preview.classList.add("hidden");
    preview.innerHTML="";
    return;
  }

  const url =
    URL.createObjectURL(file);

  preview.classList.remove("hidden");

  preview.innerHTML = `

    <img
      src="${url}"
      alt="پیش‌نمایش"
    >

    <button
      type="button"
      class="remove-image"
      onclick="removeSelectedImage()"
    >
      حذف تصویر انتخاب‌شده
    </button>

  `;

});


/* =====================================================
   REMOVE SELECTED IMAGE
===================================================== */

function removeSelectedImage(){

  imageInput.value = "";

  preview.innerHTML = "";

  preview.classList.add("hidden");

}


/* =====================================================
   UPLOAD IMAGE
===================================================== */

async function uploadImage(file){

  if(!file)
    return null;

  const extension =
    file.name.split(".").pop();

  const fileName =
    `${Date.now()}-${Math.random()
      .toString(36)
      .substring(2)}.${extension}`;

  const filePath =
    `articles/${fileName}`;


  const {
    error
  } =
    await supabaseClient
      .storage
      .from("article-images")
      .upload(
        filePath,
        file,
        {
          cacheControl:"3600",
          upsert:false
        }
      );


  if(error)
    throw error;


  const {
    data
  } =
    supabaseClient
      .storage
      .from("article-images")
      .getPublicUrl(filePath);


  return data.publicUrl;

}


/* =====================================================
   GET STORAGE PATH
===================================================== */

function getStoragePath(url){

  if(!url)
    return null;

  const marker =
    "/storage/v1/object/public/article-images/";

  const index =
    url.indexOf(marker);

  if(index === -1)
    return null;

  return decodeURIComponent(
    url.substring(
      index + marker.length
    )
  );

}


/* =====================================================
   DELETE STORAGE IMAGE
===================================================== */

async function deleteStorageImage(url){

  const path =
    getStoragePath(url);

  if(!path)
    return;

  const {
    error
  } =
    await supabaseClient
      .storage
      .from("article-images")
      .remove([path]);

  if(error)
    console.warn(
      "Storage delete error:",
      error
    );

}


/* =====================================================
   SAVE ARTICLE
===================================================== */

articleForm.addEventListener("submit",async(e)=>{

  e.preventDefault();

  clearMessage(formMessage);

  saveBtn.disabled=true;
  saveBtn.textContent="در حال ذخیره...";


  try{

    const title =
      document
        .getElementById("articleTitle")
        .value.trim();

    const category =
      document
        .getElementById("articleCategory")
        .value.trim();

    const content =
      document
        .getElementById("articleContent")
        .value.trim();

    const status =
      document
        .getElementById("articleStatus")
        .value;


    let imageUrl =
      oldImageUrl;


    /* NEW IMAGE */

    const file =
      imageInput.files[0];

    if(file){

      imageUrl =
        await uploadImage(file);

      /* remove old image */

      if(
        editingId &&
        oldImageUrl
      ){

        await deleteStorageImage(
          oldImageUrl
        );

      }

    }


    const articleData = {

      title,
      content,
      category,
      status,
      image_url:imageUrl

    };


    if(editingId){

      const {
        error
      } =
        await supabaseClient
          .from("article")
          .update(articleData)
          .eq("id",editingId);

      if(error)
        throw error;

      showMessage(
        formMessage,
        "مقاله با موفقیت ویرایش شد.",
        "success"
      );

    }else{

      const {
        error
      } =
        await supabaseClient
          .from("article")
          .insert(articleData);

      if(error)
        throw error;

      showMessage(
        formMessage,
        "مقاله با موفقیت اضافه شد.",
        "success"
      );

    }


    resetForm();

    await loadArticles();


  }catch(error){

    console.error(error);

    showMessage(
      formMessage,
      "خطا در ذخیره مقاله: " +
      (error.message || "خطای نامشخص"),
      "error"
    );

  }finally{

    saveBtn.disabled=false;
    saveBtn.textContent=
      editingId
        ? "ذخیره تغییرات"
        : "ذخیره مقاله";

  }

});


/* =====================================================
   EDIT ARTICLE
===================================================== */

async function editArticle(id){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("article")
      .select("*")
      .eq("id",id)
      .single();


  if(error){

    alert("خطا در دریافت مقاله");
    return;

  }


  editingId =
    data.id;

  oldImageUrl =
    data.image_url || null;


  document
    .getElementById("articleTitle")
    .value =
      data.title || "";


  document
    .getElementById("articleCategory")
    .value =
      data.category || "";


  document
    .getElementById("articleContent")
    .value =
      data.content || "";


  document
    .getElementById("articleStatus")
    .value =
      data.status || "draft";


  imageInput.value="";


  if(data.image_url){

    preview.classList.remove("hidden");

    preview.innerHTML = `

      <img
        src="${escapeHtml(data.image_url)}"
        alt=""
        onerror="this.parentElement.innerHTML='🧠'"
      >

      <button
        type="button"
        class="remove-image"
        onclick="removeCurrentImage()"
      >
        حذف تصویر
      </button>

    `;

  }else{

    preview.classList.add("hidden");
    preview.innerHTML="";

  }


  formTitle.textContent=
    "ویرایش مقاله";

  saveBtn.textContent=
    "ذخیره تغییرات";

  cancelBtn.classList.remove("hidden");

  document
    .querySelector(".dashboard")
    .scrollIntoView({
      behavior:"smooth"
    });

}


/* =====================================================
   REMOVE CURRENT IMAGE
===================================================== */

async function removeCurrentImage(){

  if(!oldImageUrl)
    return;

  const confirmed =
    confirm(
      "تصویر این مقاله حذف شود؟"
    );

  if(!confirmed)
    return;


  try{

    await deleteStorageImage(
      oldImageUrl
    );


    const {
      error
    } =
      await supabaseClient
        .from("article")
        .update({
          image_url:null
        })
        .eq("id",editingId);


    if(error)
      throw error;


    oldImageUrl=null;

    preview.innerHTML="";

    preview.classList.add("hidden");

    showMessage(
      formMessage,
      "تصویر حذف شد.",
      "success"
    );


  }catch(error){

    console.error(error);

    showMessage(
      formMessage,
      "حذف تصویر انجام نشد.",
      "error"
    );

  }

}


/* =====================================================
   DELETE ARTICLE
===================================================== */

async function deleteArticle(id){

  const confirmed =
    confirm(
      "این مقاله و تصویر آن حذف شود؟"
    );

  if(!confirmed)
    return;


  try{

    /* get article */

    const {
      data:article,
      error:getError
    } =
      await supabaseClient
        .from("article")
        .select("image_url")
        .eq("id",id)
        .single();


    if(getError)
      throw getError;


    /* delete DB */

    const {
      error
    } =
      await supabaseClient
        .from("article")
        .delete()
        .eq("id",id);


    if(error)
      throw error;


    /* delete storage image */

    if(article?.image_url){

      await deleteStorageImage(
        article.image_url
      );

    }


    await loadArticles();


  }catch(error){

    console.error(error);

    alert(
      "حذف انجام نشد: " +
      (error.message || "")
    );

  }

}


/* =====================================================
   RESET FORM
===================================================== */

function resetForm(){

  editingId=null;
  oldImageUrl=null;

  articleForm.reset();

  imageInput.value="";

  preview.innerHTML="";

  preview.classList.add("hidden");

  formTitle.textContent=
    "افزودن مقاله";

  saveBtn.textContent=
    "ذخیره مقاله";

  cancelBtn.classList.add("hidden");

}


/* =====================================================
   CANCEL EDIT
===================================================== */

cancelBtn.addEventListener(
  "click",
  ()=>{
    resetForm();
    clearMessage(formMessage);
  }
);


/* =====================================================
   DARK MODE
===================================================== */

const themeBtn =
  document.getElementById("themeBtn");

themeBtn.addEventListener(
  "click",
  ()=>{
    document.body.classList.toggle("dark");

    localStorage.setItem(
      "adminDark",
      document.body.classList.contains("dark")
        ? "1"
        : "0"
    );
  }
);


if(
  localStorage.getItem("adminDark")==="1"
){
  document.body.classList.add("dark");
}
