<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>پنل مدیریت | روان‌شناسی‌نامه</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #faf8fb;
      --card: #ffffff;
      --text: #29252b;
      --muted: #8b828e;
      --border: #eee8ef;
      --primary: #c987ad;
      --primary-dark: #a9628b;
      --soft: #f7edf4;
      --danger: #d66b79;
      --shadow: 0 10px 30px rgba(80, 50, 75, 0.07);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background:
        radial-gradient(circle at top right, #f8eaf3, transparent 35%),
        var(--bg);
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: var(--shadow);
    }

    .logo {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--soft);
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 20px;
    }

    h1,
    h2,
    h3 {
      margin-top: 0;
    }

    .login-card h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .login-card p {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    /* INPUTS */

    .field {
      margin-bottom: 17px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 12px;
      padding: 12px 14px;
      outline: none;
      transition: .2s;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.9;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(201, 135, 173, .12);
    }

    /* BUTTONS */

    button {
      border: 0;
      cursor: pointer;
      border-radius: 11px;
      padding: 11px 17px;
      transition: .2s;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: white;
      font-weight: bold;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: var(--soft);
      color: var(--primary-dark);
    }

    .btn-danger {
      background: #fff0f2;
      color: var(--danger);
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
    }

    /* ADMIN */

    .admin {
      min-height: 100vh;
    }

    .topbar {
      height: 70px;
      background: rgba(255,255,255,.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      background: var(--soft);
      color: var(--primary-dark);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .container {
      width: min(1150px, 92%);
      margin: 35px auto;
    }

    .welcome {
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    .welcome p {
      color: var(--muted);
      margin: 0;
      font-size: 14px;
    }

    /* STATS */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat span {
      color: var(--muted);
      font-size: 13px;
    }

    .stat strong {
      display: block;
      font-size: 27px;
      margin-top: 8px;
    }

    /* CONTENT */

    .grid {
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 22px;
      align-items: start;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    /* IMAGE */

    .image-upload {
      border: 1px dashed #dccbd7;
      border-radius: 14px;
      padding: 18px;
      background: #fcf9fb;
      text-align: center;
    }

    .image-upload input {
      border: 0;
      padding: 5px;
      background: transparent;
    }

    .preview {
      max-width: 100%;
      max-height: 220px;
      border-radius: 12px;
      margin-top: 12px;
      display: none;
      object-fit: cover;
    }

    /* ARTICLES */

    .article-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .article-item {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .article-info {
      min-width: 0;
    }

    .article-info h3 {
      font-size: 14px;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .article-meta {
      color: var(--muted);
      font-size: 11px;
    }

    .badge {
      display: inline-block;
      margin-top: 7px;
      padding: 4px 8px;
      border-radius: 20px;
      background: var(--soft);
      color: var(--primary-dark);
      font-size: 10px;
    }

    .article-actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 35px 10px;
      font-size: 13px;
    }

    .message {
      padding: 11px 13px;
      border-radius: 10px;
      margin-bottom: 15px;
      font-size: 13px;
      display: none;
    }

    .success {
      background: #eef8f1;
      color: #43815a;
    }

    .error {
      background: #fff0f2;
      color: #a84e5b;
    }

    .loading {
      color: var(--muted);
      font-size: 13px;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .topbar {
        padding: 0 4%;
      }
    }

    @media (max-width: 550px) {
      .container {
        width: 94%;
        margin: 25px auto;
      }

      .card {
        padding: 18px;
      }

      .login-card {
        padding: 26px;
      }

      .article-item {
        align-items: flex-start;
        flex-direction: column;
      }

      .article-actions {
        width: 100%;
      }

      .article-actions button {
        flex: 1;
      }

      .welcome h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage" class="login-page">

  <div class="login-card">

    <div class="logo">ن</div>

    <h1>پنل مدیریت</h1>

    <p>مدیریت مقالات روان‌شناسی‌نامه</p>

    <div id="loginMessage" class="message"></div>

    <div class="field">
      <label>ایمیل</label>
      <input id="email" type="email" placeholder="ایمیل مدیر">
    </div>

    <div class="field">
      <label>رمز عبور</label>
      <input id="password" type="password" placeholder="رمز عبور">
    </div>

    <button class="btn-primary" onclick="login()">
      ورود به پنل
    </button>

  </div>

</section>


<!-- ADMIN -->

<section id="adminPage" class="admin hidden">

  <header class="topbar">

    <div class="brand">
      <div class="brand-mark">ن</div>
      <span>روان‌شناسی‌نامه</span>
    </div>

    <div class="top-actions">
      <button class="btn-secondary btn-small" onclick="toggleDark()">
        حالت شب
      </button>

      <button class="btn-danger btn-small" onclick="logout()">
        خروج
      </button>
    </div>

  </header>


  <main class="container">

    <div class="welcome">
      <h1>مدیریت محتوا</h1>
      <p>مقالات سایتت را از اینجا مدیریت کن.</p>
    </div>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        <span>کل مقالات</span>
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat">
        <span>منتشر شده</span>
        <strong id="publishedCount">0</strong>
      </div>

      <div class="stat">
        <span>پیش‌نویس</span>
        <strong id="draftCount">0</strong>
      </div>

    </div>


    <div class="grid">

      <!-- FORM -->

      <div class="card">

        <h2 id="formTitle">افزودن مقاله جدید</h2>

        <div id="formMessage" class="message"></div>

        <input type="hidden" id="editId">

        <div class="field">
          <label>عنوان مقاله</label>
          <input id="title" type="text" placeholder="عنوان مقاله را وارد کن">
        </div>

        <div class="field">
          <label>دسته‌بندی</label>
          <input id="category" type="text" placeholder="مثلاً تاریخ روان‌شناسی">
        </div>

        <div class="field">
          <label>متن مقاله</label>
          <textarea id="content" placeholder="متن مقاله را اینجا بنویس..."></textarea>
        </div>

        <div class="field">
          <label>تصویر مقاله</label>

          <div class="image-upload">

            <input
              id="imageInput"
              type="file"
              accept="image/*"
              onchange="previewImage(event)"
            >

            <img id="imagePreview" class="preview">

          </div>

        </div>

        <div class="field">
          <label>وضعیت</label>

          <select id="status">
            <option value="published">منتشر شده</option>
            <option value="draft">پیش‌نویس</option>
          </select>

        </div>

        <button class="btn-primary" onclick="saveArticle()">
          ذخیره مقاله
        </button>

        <button
          id="cancelEdit"
          class="btn-secondary hidden"
          style="width:100%; margin-top:10px;"
          onclick="cancelEdit()"
        >
          لغو ویرایش
        </button>

      </div>


      <!-- ARTICLE LIST -->

      <div class="card">

        <h2>مقالات</h2>

        <div id="articleList" class="article-list">
          <div class="loading">در حال دریافت مقالات...</div>
        </div>

      </div>

    </div>

  </main>

</section>


<script>

  /* SUPABASE */

  const SUPABASE_URL =
    "https://wwzgywcezzzrgiqprdeg.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_uEoXARjUJ3XhVNWneTMZjQ_uTzwYyt8";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  /* ELEMENTS */

  const loginPage = document.getElementById("loginPage");
  const adminPage = document.getElementById("adminPage");


  /* MESSAGE */

  function showMessage(elementId, text, type) {

    const el = document.getElementById(elementId);

    el.textContent = text;
    el.className = "message " + type;
    el.style.display = "block";

  }


  function hideMessage(elementId) {

    const el = document.getElementById(elementId);

    el.style.display = "none";

  }


  /* LOGIN */

  async function login() {

    hideMessage("loginMessage");

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {

      showMessage(
        "loginMessage",
        "ایمیل و رمز عبور را وارد کن.",
        "error"
      );

      return;
    }

    const { error } =
      await db.auth.signInWithPassword({
        email,
        password
      });

    if (error) {

      showMessage(
        "loginMessage",
        "ورود ناموفق بود: " + error.message,
        "error"
      );

      return;
    }

    showAdmin();

  }


  /* LOGOUT */

  async function logout() {

    await db.auth.signOut();

    adminPage.classList.add("hidden");
    loginPage.classList.remove("hidden");

  }


  /* SESSION */

  async function checkSession() {

    const { data } =
      await db.auth.getSession();

    if (data.session) {
      showAdmin();
    }

  }


  db.auth.onAuthStateChange(
    function(event, session) {

      if (session) {
        showAdmin();
      }

    }
  );


  function showAdmin() {

    loginPage.classList.add("hidden");
    adminPage.classList.remove("hidden");

    loadArticles();

  }


  /* LOAD ARTICLES */

  async function loadArticles() {

    const list =
      document.getElementById("articleList");

    list.innerHTML =
      '<div class="loading">در حال دریافت مقالات...</div>';

    const { data, error } =
      await db
        .from("article")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {

      list.innerHTML =
        '<div class="empty">خطا در دریافت مقالات.</div>';

      return;
    }

    updateStats(data || []);

    if (!data || data.length === 0) {

      list.innerHTML =
        '<div class="empty">هنوز مقاله‌ای ایجاد نشده.</div>';

      return;
    }

    list.innerHTML = "";

    data.forEach(article => {

      const item =
        document.createElement("div");

      item.className = "article-item";

      const info =
        document.createElement("div");

      info.className = "article-info";

      const title =
        document.createElement("h3");

      title.textContent =
        article.title || "بدون عنوان";

      const meta =
        document.createElement("div");

      meta.className = "article-meta";

      meta.textContent =
        article.category || "بدون دسته‌بندی";

      const badge =
        document.createElement("span");

      badge.className = "badge";

      badge.textContent =
        article.status === "published"
          ? "منتشر شده"
          : "پیش‌نویس";

      info.appendChild(title);
      info.appendChild(meta);
      info.appendChild(badge);


      const actions =
        document.createElement("div");

      actions.className = "article-actions";


      const edit =
        document.createElement("button");

      edit.className =
        "btn-secondary btn-small";

      edit.textContent = "ویرایش";

      edit.onclick =
        () => editArticle(article);


      const del =
        document.createElement("button");

      del.className =
        "btn-danger btn-small";

      del.textContent = "حذف";

      del.onclick =
        () => deleteArticle(article.id);


      actions.appendChild(edit);
      actions.appendChild(del);

      item.appendChild(info);
      item.appendChild(actions);

      list.appendChild(item);

    });

  }


  /* STATS */

  function updateStats(articles) {

    const total =
      articles.length;

    const published =
      articles.filter(
        a => a.status === "published"
      ).length;

    const draft =
      articles.filter(
        a => a.status === "draft"
      ).length;

    document.getElementById("totalCount")
      .textContent = total;

    document.getElementById("publishedCount")
      .textContent = published;

    document.getElementById("draftCount")
      .textContent = draft;

  }


  /* IMAGE PREVIEW */

  function previewImage(event) {

    const file =
      event.target.files[0];

    const preview =
      document.getElementById("imagePreview");

    if (!file) {

      preview.style.display = "none";
      preview.src = "";

      return;
    }

    if (!file.type.startsWith("image/")) {

      showMessage(
        "formMessage",
        "لطفاً یک فایل تصویری انتخاب کن.",
        "error"
      );

      event.target.value = "";

      return;
    }

    preview.src =
      URL.createObjectURL(file);

    preview.style.display = "block";

  }


  /* UPLOAD IMAGE */

  async function uploadImage(file) {

    if (!file) {
      return null;
    }

    const extension =
      file.name.split(".").pop().toLowerCase();

    const filePath =
      "articles/" +
      Date.now() +
      "_" +
      Math.random()
        .toString(36)
        .substring(2, 10) +
      "." +
      extension;


    const { error: uploadError } =
      await db.storage
        .from("article-images")
        .upload(
          filePath,
          file,
          {
            cacheControl: "3600",
            upsert: false,
            contentType: file.type
          }
        );


    if (uploadError) {

      throw new Error(
        "آپلود تصویر ناموفق بود: " +
        uploadError.message
      );

    }


    const { data } =
      db.storage
        .from("article-images")
        .getPublicUrl(filePath);


    return data.publicUrl;

  }


  /* SAVE ARTICLE */

  async function saveArticle() {

    hideMessage("formMessage");

    const title =
      document.getElementById("title")
        .value.trim();

    const category =
      document.getElementById("category")
        .value.trim();

    const content =
      document.getElementById("content")
        .value.trim();

    const status =
      document.getElementById("status")
        .value;

    const editId =
      document.getElementById("editId")
        .value;

    const imageFile =
      document.getElementById("imageInput")
        .files[0];


    if (!title || !content) {

      showMessage(
        "formMessage",
        "عنوان و متن مقاله الزامی است.",
        "error"
      );

      return;
    }


    const button =
      document.querySelector(
        ".card .btn-primary"
      );

    button.disabled = true;
    button.textContent = "در حال ذخیره...";


    try {

      let imageUrl = null;


      /* IMAGE */

      if (imageFile) {

        imageUrl =
          await uploadImage(imageFile);

      }


      const articleData = {

        title,
        content,
        category,
        status

      };


      if (imageUrl) {
        articleData.image_url = imageUrl;
      }


      /* UPDATE */

      if (editId) {

        const { error } =
          await db
            .from("article")
            .update(articleData)
            .eq("id", editId);

        if (error) {
          throw error;
        }

        showMessage(
          "formMessage",
          "مقاله با موفقیت ویرایش شد.",
          "success"
        );

      }


      /* INSERT */

      else {

        const { error } =
          await db
            .from("article")
            .insert(articleData);

        if (error) {
          throw error;
        }

        showMessage(
          "formMessage",
          "مقاله با موفقیت منتشر شد.",
          "success"
        );

      }


      clearForm();
      await loadArticles();

    }


    catch (error) {

      console.error(error);

      showMessage(
        "formMessage",
        error.message ||
        "خطایی هنگام ذخیره رخ داد.",
        "error"
      );

    }


    finally {

      button.disabled = false;
      button.textContent = "ذخیره مقاله";

    }

  }


  /* EDIT */

  function editArticle(article) {

    document.getElementById("editId")
      .value = article.id;

    document.getElementById("title")
      .value = article.title || "";

    document.getElementById("category")
      .value = article.category || "";

    document.getElementById("content")
      .value = article.content || "";

    document.getElementById("status")
      .value = article.status || "draft";


    const preview =
      document.getElementById("imagePreview");


    if (article.image_url) {

      preview.src =
        article.image_url;

      preview.style.display =
        "block";

    } else {

      preview.style.display =
        "none";

    }


    document.getElementById("formTitle")
      .textContent = "ویرایش مقاله";

    document.getElementById("cancelEdit")
      .classList.remove("hidden");

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /* CANCEL EDIT */

  function cancelEdit() {

    clearForm();

  }


  /* CLEAR FORM */

  function clearForm() {

    document.getElementById("editId")
      .value = "";

    document.getElementById("title")
      .value = "";

    document.getElementById("category")
      .value = "";

    document.getElementById("content")
      .value = "";

    document.getElementById("status")
      .value = "published";

    document.getElementById("imageInput")
      .value = "";

    const preview =
      document.getElementById("imagePreview");

    preview.src = "";
    preview.style.display = "none";

    document.getElementById("formTitle")
      .textContent = "افزودن مقاله جدید";

    document.getElementById("cancelEdit")
      .classList.add("hidden");

  }


  /* DELETE */

  async function deleteArticle(id) {

    const ok =
      confirm(
        "آیا از حذف این مقاله مطمئنی؟"
      );

    if (!ok) return;


    const { error } =
      await db
        .from("article")
        .delete()
        .eq("id", id);


    if (error) {

      showMessage(
        "formMessage",
        "حذف مقاله ناموفق بود: " +
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "formMessage",
      "مقاله حذف شد.",
      "success"
    );


    loadArticles();

  }


  /* DARK MODE */

  function toggleDark() {

    const root =
      document.documentElement;

    const dark =
      root.dataset.theme === "dark";


    if (dark) {

      root.dataset.theme = "";

      document.body.style.background =
        "#faf8fb";

      document.body.style.color =
        "#29252b";

    } else {

      root.dataset.theme = "dark";

      document.body.style.background =
        "#211d22";

      document.body.style.color =
        "#f5eef4";

    }

  }


  /* START */

  checkSession();

</script>
